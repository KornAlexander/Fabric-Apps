name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Publication gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the commit scan below needs every pushed commit and its parents, and
          # the media churn check reads recent history. A shallow window silently shortens both.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: verify_publishable
        run: python tools/verify_publishable.py
      # The tree is not the history: a leak committed and scrubbed again in a later commit is
      # still in what was pushed. Scan every blob the pushed (or PR) commits added or changed.
      # ⚠️ NEVER A FIXED WINDOW. Without a usable before-commit (first push, force push) the whole
      # history reachable from the new tip is scanned: slower, but it cannot miss the start.
      - name: verify_publishable on every pushed commit
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # A force push leaves the old tip unreachable from every ref, so the clone lacks it.
            # Ask for that exact commit before falling back to a whole-history scan.
            git fetch --no-tags --quiet origin "$BEFORE" || true
          fi
          if [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            python tools/verify_publishable.py --commits "$BEFORE..$AFTER"
          else
            echo "no usable before-commit (first or force push): scanning all history reachable from $AFTER"
            python tools/verify_publishable.py --commits "$AFTER"
          fi
      - name: verify_publishable on every PR commit
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python tools/verify_publishable.py --commits "$BASE..$HEAD"
      - name: App gallery is generated, not hand-maintained
        run: python tools/generate_index.py --check
      - name: README sections
        run: python tools/check_readme_sections.py
      - name: Gallery and LinkedIn drafts
        run: python tools/check_gallery_drafts.py
      - name: Links resolve
        run: python tools/check_links.py
      - name: Media budget
        run: python tools/check_media_budget.py

  apps:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: [gate, discover]
    # Public CI builds are public builds: unofficial live feeds stay off whatever a file says.
    env:
      VITE_UNOFFICIAL_FEEDS: none
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.discover.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: ${{ matrix.app }}
        # Strict: a lockfile out of step with package.json fails here instead of being papered over
        # by a silent `npm install`. Only an app that ships no lockfile at all is installed loosely.
        # The app path goes through env, never into the script text: a directory name is repo
        # content, and `${{ }}` inside `run:` is pasted into the shell before it runs.
        env:
          APP: ${{ matrix.app }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "::warning::$APP has no package-lock.json; installing without one"
            npm install --no-audit --no-fund
          fi
      - name: Lint
        working-directory: ${{ matrix.app }}
        run: npm run --if-present lint
      - name: Test
        working-directory: ${{ matrix.app }}
        run: npm run --if-present test
      - name: Build
        working-directory: ${{ matrix.app }}
        run: npm run --if-present build

  discover:
    name: Discover apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.find.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        # Every folder holding a package.json under a category directory is an app.
        # Discovering them beats maintaining a list that silently goes stale.
        run: |
          apps=$(find games-and-learn fabric-admin industry -name package.json -not -path '*/node_modules/*' -maxdepth 3 -printf '%h\n' 2>/dev/null | sort -u | jq -R -s -c 'split("\n")[:-1]')
          echo "apps=${apps:-[]}" >> "$GITHUB_OUTPUT"
