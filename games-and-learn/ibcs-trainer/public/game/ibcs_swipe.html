<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>IBCS Chart Swipe</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif}
canvas{border-radius:8px;box-shadow:0 0 60px rgba(80,160,255,0.25);max-width:100vw;max-height:100vh;touch-action:none}
#nameContainer{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;display:none}
#nameContainer input{font-size:18px;padding:10px 15px;border-radius:8px;border:2px solid #60a8ff;background:rgba(20,30,50,0.9);color:#fff;text-align:center;width:240px}
</style>
</head><body>
<canvas id="c" width="600" height="900" tabindex="0"></canvas>
<div id="nameContainer">
  <label style="color:#fff;font-size:20px;display:block;margin-bottom:12px">Enter your name:</label>
  <input id="playerNameInput" type="text" maxlength="20" placeholder="Player" />
  <div style="margin-top:12px;color:#aaa;font-size:14px">Press Enter to start</div>
</div>
<pre id="gameStats" style="display:none"></pre>
<script src="ibcs_rules.js"></script>
<script src="ibcs_charts.js"></script>
<script src="ibcs_stats.js"></script>
<script src="ibcs_mobile.js"></script>
<script>
(() => {
"use strict";
const cv = document.getElementById('c'), ctx = cv.getContext('2d', { alpha:false });
const W = 600, H = 900;          // portrait: card-swipe plays upright on mobile
if (window.IBCSMobile) window.IBCSMobile.makeResponsive(cv, { orientation:'portrait' });
// Crisp on every display: makeResponsive() sets the canvas CSS size to fit the
// viewport; we then size the pixel buffer to THAT displayed size x devicePixelRatio
// (recomputed on resize / zoom / monitor change), so the canvas is never up-scaled
// and never blurry — on phones or big desktop monitors alike. All drawing stays in
// logical 600x900 coords; loop() applies ctx.setTransform(cv.width/W,0,0,cv.height/H).
function hidpi(){
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  const cssW = parseFloat(cv.style.width) || cv.clientWidth || W;
  const bw = Math.max(W, Math.round(cssW * dpr));
  const bh = Math.round(bw * H / W);   // keep exact 2:3 so the transform stays uniform
  if (cv.width !== bw || cv.height !== bh){ cv.width = bw; cv.height = bh; }
}
hidpi();
addEventListener('resize', hidpi, { passive:true });
addEventListener('orientationchange', () => setTimeout(hidpi, 260), { passive:true });
const charts = IBCSCharts(ctx);
const {RULES} = window.IBCS;

// ---------- text helpers ----------
function txt(t,size,x,y,c,center,bold){ctx.fillStyle=c;ctx.font=(bold?'bold ':'')+size+"px 'Segoe UI',system-ui,sans-serif";ctx.textAlign=center?'center':'left';ctx.textBaseline='alphabetic';ctx.fillText(t,x,y);ctx.textAlign='left';}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
// word-wrap into lines that fit maxW; returns array of lines.
function wrap(t,size,maxW){ctx.font=size+"px 'Segoe UI',system-ui,sans-serif";const words=String(t).split(' ');const lines=[];let cur='';for(const w of words){const test=cur?cur+' '+w:w;if(ctx.measureText(test).width>maxW&&cur){lines.push(cur);cur=w;}else cur=test;}if(cur)lines.push(cur);return lines;}

// ---------- game state ----------
let state='title';           // title | playing | feedback | over
let playerName='';
let deck=[];                 // shuffled queue of {rule, compliant}
let card=null;               // current card
let score=0, combo=0, best=0, lives=3;
let answered=0, correct=0, violationsCaught=0;
let startTime=0;
const ROUND_TIME=9;          // seconds per card
let cardTimer=ROUND_TIME;
let dragX=0, dragging=false, dragStart=0, autoFly=0; // autoFly: -1 left, +1 right
let feedback=null, feedbackT=0, feedbackTotalT=0;
let titleAnim=0;
let naming=false;            // true while the name-entry overlay is open
const keys={};

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildDeck(){
  deck=shuffle(RULES.slice()).map(r=>({rule:r, compliant:Math.random()<0.5}));
}
function nextCard(){
  if(deck.length===0){ endGame(true); return; }
  card=deck.pop(); cardTimer=ROUND_TIME; dragX=0; dragging=false; autoFly=0;
}
// Advance past the feedback banner early (after a short grace so the answering
// gesture doesn't instantly skip the explanation).
function advanceFeedback(){
  if(state!=='feedback') return;
  if(feedbackTotalT - feedbackT < 0.35) return;
  if(feedback&&feedback.last){ endGame(false); }
  else { state='playing'; nextCard(); }
}
function startGame(){
  score=0;combo=0;best=0;lives=3;answered=0;correct=0;violationsCaught=0;
  startTime=performance.now(); buildDeck(); state='playing'; nextCard();
}

// answer: guess = true means player says "compliant"
function answer(guess){
  if(state!=='playing'||!card) return;
  answered++;
  const right = (guess === card.compliant);
  if(right){
    correct++; combo++; best=Math.max(best,combo);
    score += 10 + (combo-1)*5;
    if(!card.compliant) violationsCaught++;
  }else{
    combo=0; lives--;
  }
  feedback={right, rule:card.rule, shown:card.compliant};
  feedbackT = right ? 2.4 : 4.5;
  feedbackTotalT = feedbackT;
  state='feedback';
  if(lives<=0){ /* let feedback show, then end */ feedback.last=true; }
}

function endGame(won){
  state='over';
  const dur=(performance.now()-startTime)/1000;
  publishRayfinStats({
    player_name: playerName||'Player',
    duration_seconds: Math.round(dur*10)/10,
    score, won,
    lives_left: Math.max(0,lives),
    deaths_total: answered-correct,
    coins_collected: correct,
    enemies_stomped: violationsCaught,
    attacks_used: answered,
    final_form: 'swipe',
    level_reached: answered,
  });
}

// ---------- input ----------
addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(state==='title'){ /* handled by name flow */ return; }
  if(state==='over'){ if(e.code==='KeyR'){ startGame(); } return; }
  if(state==='playing'){
    if(e.code==='ArrowLeft'||e.code==='KeyA'){ autoFly=-1; setTimeout(()=>answer(false),120); }
    else if(e.code==='ArrowRight'||e.code==='KeyD'){ autoFly=1; setTimeout(()=>answer(true),120); }
  }
  else if(state==='feedback'){ advanceFeedback(); }
});
addEventListener('keyup',e=>{keys[e.code]=false;});

function canvasXY(e){const r=cv.getBoundingClientRect();const px=(e.touches?e.touches[0].clientX:e.clientX)-r.left;const py=(e.touches?e.touches[0].clientY:e.clientY)-r.top;return{x:px*(W/r.width),y:py*(H/r.height)};}
function pointerDown(e){
  const {x,y}=canvasXY(e);
  if(state==='title'){ return; }
  if(state==='over'){ startGame(); return; }
  if(state==='feedback'){ advanceFeedback(); return; }
  if(state!=='playing') return;
  // buttons row
  if(y>H-100){ if(x<W/2){ autoFly=-1; answer(false);} else { autoFly=1; answer(true);} return; }
  dragging=true; dragStart=x;
}
function pointerMove(e){ if(dragging){ const {x}=canvasXY(e); dragX=x-dragStart; e.preventDefault&&e.preventDefault(); } }
function pointerUp(){
  if(!dragging) return; dragging=false;
  if(dragX>110){ autoFly=1; answer(true); }
  else if(dragX<-110){ autoFly=-1; answer(false); }
  else { dragX=0; }
}
cv.addEventListener('mousedown',pointerDown); cv.addEventListener('mousemove',pointerMove); addEventListener('mouseup',pointerUp);
cv.addEventListener('touchstart',pointerDown,{passive:false}); cv.addEventListener('touchmove',pointerMove,{passive:false}); addEventListener('touchend',pointerUp);

// ---------- name entry ----------
const nameBox=document.getElementById('nameContainer'), nameInput=document.getElementById('playerNameInput');
cv.addEventListener('click',()=>{ if(state==='title'){ naming=true; nameBox.style.display='block'; nameInput.focus(); } });
nameInput.addEventListener('keydown',e=>{ if(e.code==='Enter'){ playerName=nameInput.value.trim()||'Player'; nameBox.style.display='none'; naming=false; startGame(); } });

// ---------- drawing ----------
function bg(){ const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#141d33'); g.addColorStop(1,'#0a0a1a'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); }

function drawCard(){
  const cw=480, ch=560;
  const cx=W/2 + dragX, cy=412;
  const rot=dragX*0.0010;
  ctx.save();
  ctx.translate(cx,cy); ctx.rotate(rot);
  // card body
  ctx.fillStyle='#fbfdff'; rr(-cw/2,-ch/2,cw,ch,20); ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle='#dde3ec'; ctx.stroke();
  // chart inside — matched do/don't pair: identical neutral style, only the
  // genuine IBCS violation differs (no colour/bitmap tell).
  charts.pair(card.rule, card.compliant, -cw/2+50, -ch/2+48, cw-100, ch-198);
  // label
  txt(card.rule.pillar+' · '+card.rule.sub, 15, 0, ch/2-92, '#5a6678', true, true);
  txt(card.rule.title, 19, 0, ch/2-62, '#1a2230', true, true);
  txt(card.rule.code, 13, 0, ch/2-34, '#90a0b5', true, false);
  // swipe hint stamps
  const a=Math.min(1,Math.abs(dragX)/110);
  if(dragX>8){ ctx.save();ctx.globalAlpha=a;ctx.strokeStyle='#37a76a';ctx.lineWidth=4;rr(-cw/2+22,-ch/2+22,168,54,8);ctx.stroke();txt('COMPLIANT',20,-cw/2+106,-ch/2+57,'#37a76a',true,true);ctx.restore(); }
  if(dragX<-8){ ctx.save();ctx.globalAlpha=a;ctx.strokeStyle='#e23b3b';ctx.lineWidth=4;rr(cw/2-190,-ch/2+22,168,54,8);ctx.stroke();txt('VIOLATES',20,cw/2-106,-ch/2+57,'#e23b3b',true,true);ctx.restore(); }
  ctx.restore();
}

function drawHUD(){
  txt('SCORE '+score, 22, 24, 44, '#fff', false, true);
  txt('Combo x'+(combo+1), 14, 24, 68, combo>0?'#37d67a':'#7a8499', false, false);
  // lives
  for(let i=0;i<3;i++){ ctx.fillStyle=i<lives?'#e23b3b':'#3a3f4a'; ctx.beginPath(); const hx=W-34-i*28, hy=40; ctx.moveTo(hx,hy+4); ctx.bezierCurveTo(hx,hy,hx-8,hy-2,hx-8,hy+5); ctx.bezierCurveTo(hx-8,hy+12,hx,hy+14,hx,hy+18); ctx.bezierCurveTo(hx,hy+14,hx+8,hy+12,hx+8,hy+5); ctx.bezierCurveTo(hx+8,hy-2,hx,hy,hx,hy+4); ctx.fill(); }
  ctx.fillStyle='#7a8499'; ctx.font="13px 'Segoe UI',system-ui,sans-serif"; ctx.textAlign='right'; ctx.textBaseline='alphabetic'; ctx.fillText('Cards left: '+deck.length, W-22, 70); ctx.textAlign='left';
  // timer bar
  const tbw=W-80, tbx=W/2-tbw/2, tw=(cardTimer/ROUND_TIME);
  ctx.fillStyle='#1c2740'; rr(tbx,96,tbw,8,4); ctx.fill();
  ctx.fillStyle=tw<0.3?'#e23b3b':'#60a8ff'; rr(tbx,96,tbw*Math.max(0,tw),8,4); ctx.fill();
}

function drawButtons(){
  // left = violates, right = compliant
  const bw=252, bh=60, by=H-92, lx=28, rx=W-28-bw;
  ctx.fillStyle='rgba(226,59,59,0.15)'; rr(lx,by,bw,bh,12); ctx.fill();
  ctx.strokeStyle='#e23b3b'; ctx.lineWidth=2; rr(lx,by,bw,bh,12); ctx.stroke();
  txt('✗  Violates  (←)', 17, lx+bw/2, by+bh/2+5, '#e23b3b', true, true);
  ctx.fillStyle='rgba(55,167,106,0.15)'; rr(rx,by,bw,bh,12); ctx.fill();
  ctx.strokeStyle='#37a76a'; ctx.lineWidth=2; rr(rx,by,bw,bh,12); ctx.stroke();
  txt('Compliant ✓ (→)', 17, rx+bw/2, by+bh/2+5, '#37d67a', true, true);
}

function drawTitle(){
  bg();
  txt('IBCS CHART SWIPE', 34, W/2, 150, '#fff', true, true);
  txt('Swipe right on compliant charts · left on the violations', 14, W/2, 184, 'rgba(96,168,255,0.9)', true, false);
  if(naming){
    // The HTML name box overlays the canvas centre — veil the area behind it so
    // the instruction lines don't show through and overlap the input.
    ctx.fillStyle='rgba(10,14,28,0.92)'; ctx.fillRect(0,210,W,H-210);
    return;
  }
  const lines=['A chart appears. Decide fast:','→ / swipe right  =  follows IBCS (a "Do")','← / swipe left   =  breaks IBCS (a "Don\u2019t")','Build combos, keep your 3 lives,','clear the deck of '+RULES.length+' rules.'];
  let y=252; for(const l of lines){ txt(l,15,W/2,y,'rgba(255,255,255,0.78)',true,false); y+=32; }
  const a=Math.sin(titleAnim*3)*0.3+0.7; ctx.save(); ctx.globalAlpha=a; txt('Click to enter your name',20,W/2,H-170,'#fff',true,true); ctx.restore();
}

function drawFeedback(){
  // keep the card frozen behind a bottom-sheet banner
  drawHUD(); drawCard(); drawButtons();
  const r=feedback;
  const bh=232, by=H-92-bh-12;          // sits just above the answer buttons
  ctx.fillStyle='rgba(8,12,24,0.92)'; rr(16,by,W-32,bh,14); ctx.fill();
  ctx.fillStyle=r.right?'#37d67a':'#e23b3b'; ctx.fillRect(16,by,6,bh);
  const verdict = r.right ? 'Correct!' : 'Not quite.';
  const truth = r.shown ? 'This chart is COMPLIANT.' : 'This chart VIOLATES IBCS.';
  txt(verdict, 24, W/2, by+40, r.right?'#37d67a':'#ff7a7a', true, true);
  txt(truth, 15, W/2, by+66, '#cfe0ff', true, false);
  txt(r.rule.code+' — '+r.rule.title, 14, W/2, by+96, '#cfe0ff', true, true);
  let yy=by+124;
  const dol=wrap('DO: '+r.rule.do,13,W-72);
  for(let i=0;i<Math.min(2,dol.length);i++){ txt(dol[i],13,W/2,yy,'#9fe6bd',true,false); yy+=19; }
  yy+=4;
  const dl=wrap("DON'T: "+r.rule.dont,13,W-72);
  for(let i=0;i<Math.min(2,dl.length);i++){ txt(dl[i],13,W/2,yy,'#f3b0b0',true,false); yy+=19; }
  if(feedbackTotalT - feedbackT >= 0.35){
    const a=Math.sin(titleAnim*4)*0.25+0.6; ctx.save(); ctx.globalAlpha=a;
    txt('tap / press → to continue', 12, W/2, by+bh-12, '#9fb0c8', true, true); ctx.restore();
  }
}

function drawOver(){
  bg();
  const dur=((performance.now()-startTime)/1000);
  const won = lives>0;
  txt(won?'DECK CLEARED!':'OUT OF LIVES', 34, W/2, 220, won?'#37d67a':'#ff7a7a', true, true);
  txt('Final score: '+score, 24, W/2, 272, '#fff', true, true);
  const acc = answered? Math.round(correct/answered*100):0;
  const rows=[['Cards answered',answered],['Correct',correct+'  ('+acc+'%)'],['Best combo','x'+(best+1)],['Violations caught',violationsCaught],['Time',Math.round(dur)+'s']];
  let y=340; for(const [k,v] of rows){ txt(k,16,W/2-170,y,'#9fb0c8',false,false); ctx.textAlign='right'; txt(String(v),16,W/2+170,y,'#fff',false,true); ctx.textAlign='left'; y+=36; }
  const a=Math.sin(titleAnim*3)*0.3+0.7; ctx.save(); ctx.globalAlpha=a; txt('Press R or click to play again',18,W/2,H-150,'#fff',true,true); ctx.restore();
}

// ---------- loop ----------
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now; titleAnim+=dt;
  if(state==='playing'){
    cardTimer-=dt;
    if(autoFly!==0){ dragX += autoFly*900*dt; }
    if(cardTimer<=0){ autoFly = card.compliant?-1:1; answer(!card.compliant); }
  } else if(state==='feedback'){
    if(autoFly!==0){ dragX += autoFly*900*dt; }
    feedbackT-=dt;
    if(feedbackT<=0){
      if(feedback&&feedback.last){ endGame(false); }
      else { state='playing'; nextCard(); }
    }
  }
  // Map logical 900x600 onto the super-sampled backing buffer for crisp output.
  ctx.setTransform(cv.width/W, 0, 0, cv.height/H, 0, 0);
  bg();
  if(state==='title') drawTitle();
  else if(state==='playing'){ drawHUD(); if(card) drawCard(); drawButtons(); }
  else if(state==='feedback'){ drawFeedback(); }
  else if(state==='over') drawOver();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body></html>
