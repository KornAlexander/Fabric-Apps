(() => {
"use strict";
const cv = document.getElementById('c'), ctx = cv.getContext('2d', { alpha: false });
const W = 900, H = 600;
ctx.imageSmoothingEnabled = false;
cv.focus();
// Scale to fit mobile/landscape viewports and show an on-screen gamepad on
// touch devices (no-op on desktop / inside the Rayfin iframe at native size).
if (window.IBCSMobile) window.IBCSMobile.makeResponsive(cv, { touchControls: true });
// Crisp on every display: makeResponsive() sets the canvas CSS size to fit the
// viewport; we then size the pixel buffer to THAT displayed size x devicePixelRatio
// (recomputed on resize / zoom / monitor change), so the canvas is never up-scaled
// and never blurry — on phones or big desktop monitors alike. All drawing stays in
// logical 900x600 coords; loop() applies ctx.setTransform(cv.width/W,0,0,cv.height/H).
function hidpi(){
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  const cssW = parseFloat(cv.style.width) || cv.clientWidth || W;
  const bw = Math.max(W, Math.round(cssW * dpr));
  const bh = Math.round(bw * H / W);   // keep exact 3:2 so the transform stays uniform
  if (cv.width !== bw || cv.height !== bh){ cv.width = bw; cv.height = bh; ctx.imageSmoothingEnabled = false; }
}
hidpi();
addEventListener('resize', hidpi, { passive: true });
addEventListener('orientationchange', () => setTimeout(hidpi, 260), { passive: true });

// ===== AUDIO =====
let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playTone(freq, dur, type='square', vol=0.08) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + dur);
}
function sfxJump(){ playTone(400,0.12,'sine',0.06); setTimeout(()=>playTone(600,0.08,'sine',0.04),50); }
function sfxCoin(){ playTone(880,0.06,'square',0.05); setTimeout(()=>playTone(1320,0.1,'square',0.04),60); }

// ===== FORM DATA =====
const FORM_DATA = {
  sparky:    {name:'Sparky',    color:'#ffdc28', atk:'thunder', evolve:'voltail',    fly:0},
  voltail:   {name:'Voltail',   color:'#e8a020', atk:'thunder', evolve:null,         fly:0},

// ===== IBCS SUCCESS — shared rule registry (see ibcs_rules.js) =====
// PLATFORMER-ONLY "IBCS 3.0" bonus stage. It is appended to *local copies* of the
// registry so the shared ibcs_rules.js (and therefore the swipe + escape-room
// games) keep exactly their original 98 rules. The helpers are redefined locally
// to span the extended 103-rule set.
const IBCS30_STAGE = {
  pillar:'IBCS 3.0', area:'Bonus', world:'The Innovation Lab',
  color:'#ffd24a', theme:'ocean', form:'shellbit', art:{e:'flatList',g:'indentList'},
  subs:[{ code:'I3', title:'Beyond IBCS 2.0 — modern report craft', rules:[
    ['I3.1','Layer the report: Overview \u2192 Exploration \u2192 Details',
      'Structure a report in clear layers: an Overview page, an Exploration page to slice freely, and Detail pages for the specifics',
      'Dump every chart onto one flat page with no reading path',{e:'flatList',g:'indentList'}],
    ['I3.2','Enable writeback',
      'Let users commit values back to the source (plan, comment, approve) right where they read the data',
      'Force users to export to Excel and email changed numbers around',{e:'numTable',g:'sparkTable'}],
    ['I3.3','Ship data apps that act (Fabric Apps)',
      'Wrap the report in an app that both shows data and triggers actions \u2014 re-run, notify, approve',
      'Leave the report as a dead-end view with no way to act on it',{e:'textSlide',g:'dataSlide'}],
    ['I3.4','Show live data (Direct Lake)',
      'Read fresh data live from the lake so the audience always sees the current state',
      'Present stale, manually-refreshed snapshots as if they were live',{e:'oneHuge',g:'smallMultiples'}],
    ['I3.5','Add Copilot / AI annotations',
      'Let AI draft the narrative and surface anomalies \u2014 then verify before you ship',
      'Paste unverified AI commentary, or hide the data behind a chatbot',{e:'observeOnly',g:'recommend'}],
  ]}],
};
const STAGES = window.IBCS.STAGES.concat([IBCS30_STAGE]);
const RULES = window.IBCS.RULES.slice();
const SUBSTAGES = window.IBCS.SUBSTAGES.slice();
(function appendBonusStage(){
  const si = STAGES.length - 1, st = IBCS30_STAGE;
  st.subs.forEach((sub, sj) => {
    const firstLvl = RULES.length + 1;
    SUBSTAGES.push({stageIdx:si, subIdx:sj, code:sub.code, title:sub.title,
      pillar:st.pillar, world:st.world, color:st.color, firstLvl});
    sub.rules.forEach(r => {
      const art = r[4] || st.art;
      RULES.push({
        lvl: RULES.length + 1, stageIdx: si, subIdx: sj, subGlobal: SUBSTAGES.length - 1,
        code: r[0], title: r[1], do: r[2], dont: r[3],
        enemyKind: art.e, good: art.g,
        pillar: st.pillar, area: st.area, sub: sub.code, subTitle: sub.title, world: st.world,
        slogan: r[2] + '  —  not: ' + r[3],
      });
    });
  });
})();
const RULE_COUNT = RULES.length; // 103 (98 base IBCS 2.0 + 5 IBCS 3.0 bonus)
function clampLvl(lvl){ return Math.max(1, Math.min(RULE_COUNT, lvl|0)); }
function ibcsRule(lvl){ return RULES[(clampLvl(lvl)-1)] || RULES[0]; }
function stageOf(lvl){ return ibcsRule(lvl).stageIdx; }
function subGlobalOf(lvl){ return ibcsRule(lvl).subGlobal; }
function isSubEnd(lvl){ const r=ibcsRule(lvl), n=ibcsRule(lvl+1); return lvl>=RULE_COUNT || n.subGlobal!==r.subGlobal; }
function isStageEnd(lvl){ const r=ibcsRule(lvl), n=ibcsRule(lvl+1); return lvl>=RULE_COUNT || n.stageIdx!==r.stageIdx; }

// ----- Per-level engine config, generated from the rules + difficulty curve -----
const LEVELS = RULES.map((r, i) => {
  const st = STAGES[r.stageIdx];
  const stageEnd = isStageEnd(i + 1);
  const final = (i + 1) === RULE_COUNT;
  const d = i / Math.max(1, RULE_COUNT - 1); // 0..1 global difficulty
  return {
    form: st.form, theme: st.theme,
    enemies: 6 + Math.round(d * 8),
    eSpd: 1.0 + d * 0.7,
    steps: 4 + Math.round(d * 3),
    hasWater: (r.stageIdx % 2 === 0),
    hasLava: r.stageIdx >= 3,
    boss: stageEnd ? (final ? 'shadow' : (r.stageIdx <= 1 ? 'bandit' : 'shadow')) : null,
    bossHp: final ? 12 : (3 + r.stageIdx),
    stageEnd,
  };
});

// ===== SUBSTAGE CHECKPOINTS =====
// A substage is a checkpoint group. Clearing a substage's last rule-level
// unlocks the NEXT substage as a startable point (persisted in localStorage),
// so returning players can begin a run from any unlocked substage.
const SUB_SAVE_KEY = 'ibcsTrainerUnlockedSubs';
let unlockedSubs = loadUnlockedSubs();
function loadUnlockedSubs(){
  const set = new Set([0]); // first substage always available
  try {
    const raw = localStorage.getItem(SUB_SAVE_KEY);
    if (raw) JSON.parse(raw).forEach(n => { if (Number.isInteger(n)) set.add(n); });
  } catch(_) { /* storage unavailable */ }
  return set;
}
function saveUnlockedSubs(){
  try { localStorage.setItem(SUB_SAVE_KEY, JSON.stringify([...unlockedSubs].sort((a,b)=>a-b))); }
  catch(_) { /* storage unavailable */ }
}
function unlockSub(idx){ if(idx>=0 && idx<SUBSTAGES.length && !unlockedSubs.has(idx)){ unlockedSubs.add(idx); saveUnlockedSubs(); } }
function isSubUnlocked(idx){ return unlockedSubs.has(idx); }
function unlockedSubsCsv(){ return [...unlockedSubs].sort((a,b)=>a-b).map(i=>SUBSTAGES[i]?SUBSTAGES[i].code:('#'+i)).join(','); }
// ISO 24896 vault memorised flag — persisted like the substage unlocks so the
// CHECK-floor vault stays "done" across reloads (stats.isoMemorized is transient).
const ISO_SAVE_KEY = 'ibcsTrainerIsoMemorized';
let isoMemorizedSaved = (()=>{ try { return localStorage.getItem(ISO_SAVE_KEY)==='1'; } catch(_) { return false; } })();
function saveIsoMemorized(){ isoMemorizedSaved=true; try { localStorage.setItem(ISO_SAVE_KEY,'1'); } catch(_) {} }

// ===== HOST PROGRESS BRIDGE (Rayfin) =====
// When embedded in the Rayfin host, completed substages/stages are persisted to
// the signed-in player's profile (the StageProgress entity, keyed by the Entra
// user id). Two messages flow over the iframe boundary:
//   * out: 'rayfin-stage-complete' — emitted the moment a substage is cleared,
//          so progress is saved incrementally (not only at game over).
//   * in:  'rayfin-progress-init'  — the host pushes the substages already
//          recorded in the database so checkpoints unlock across devices.
function emitStageComplete(subIdx, lvl){
  const sub = SUBSTAGES[subIdx]; if(!sub) return;
  const payload = {
    substage_index: subIdx,
    substage_code: sub.code,
    substage_title: sub.title,
    stage_index: sub.stageIdx,
    stage_pillar: sub.pillar,
    stage_world: sub.world,
    level_reached: lvl,
    stage_completed: isStageEnd(lvl),
    timestamp: new Date().toISOString(),
  };
  try{ if(window.parent && window.parent!==window){ window.parent.postMessage({type:'rayfin-stage-complete',payload}, window.location.origin); } }catch(_){/* cross-origin guard */}
}
// Per-level learning summary shown after every cleared rule-level. Emitted to the
// host so the React app can later surface a richer recap (e.g. a video summary).
// `video_url` is reserved for that future integration; it is null until a clip is
// mapped for the rule in LEVEL_VIDEO below.
const LEVEL_VIDEO = {}; // { lvl: 'https://…' } — fill in to enable per-rule videos.
function emitLevelSummary(lvl){
  const r = ibcsRule(lvl); if(!r) return;
  const payload = {
    level: lvl,
    rule_code: r.code,
    rule_title: r.title,
    do: r.do,
    dont: r.dont,
    pillar: r.pillar,
    area: r.area,
    substage: r.sub,
    substage_title: r.subTitle,
    world: r.world,
    do_image: window.IBCS.imagePath(r.code, 'do'),
    dont_image: window.IBCS.imagePath(r.code, 'dont'),
    video_url: LEVEL_VIDEO[lvl] || null,
    timestamp: new Date().toISOString(),
  };
  try{ if(window.parent && window.parent!==window){ window.parent.postMessage({type:'rayfin-level-summary',payload}, window.location.origin); } }catch(_){/* cross-origin guard */}
}
function applyHostProgress(indices){
  if(!Array.isArray(indices)) return;
  indices.forEach(n => { if(Number.isInteger(n)) unlockSub(n); });
}
window.addEventListener('message', e => {
  if(e.origin !== window.location.origin) return;
  const d = e.data;
  if(d && d.type==='rayfin-progress-init') applyHostProgress(d.unlocked);
});

// ===== CHART GLYPH DRAWING =====
// Draws the chart picture itself inside (x,y,w,h). Shared by enemies & collectibles.
function pieSlices(cx,cy,r,cols,vals){
  let a=-Math.PI/2;const tot=vals.reduce((s,v)=>s+v,0);
  for(let i=0;i<vals.length;i++){const a2=a+vals[i]/tot*Math.PI*2;
    ctx.fillStyle=cols[i%cols.length];ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a,a2);ctx.closePath();ctx.fill();a=a2;}
}
// Vertical columns helper: calls draw(bx,by,bw,bh,i) for each bar.
function vBars(x,y,w,h,vals,draw){
  const bw=(w-2)/vals.length-2;
  for(let i=0;i<vals.length;i++){const bx=x+i*(bw+2),bh=Math.max(2,h*vals[i]),by=y+h-bh;draw(bx,by,Math.max(2,bw),bh,i);}
}
// Diagonal hatch fill clipped to a rect (forecast notation).
function hatchRect(bx,by,bw,bh,col){
  ctx.save();ctx.beginPath();ctx.rect(bx,by,bw,bh);ctx.clip();
  ctx.strokeStyle=col;ctx.lineWidth=1;
  for(let d=-bh;d<bw;d+=3){ctx.beginPath();ctx.moveTo(bx+d,by+bh);ctx.lineTo(bx+d+bh,by);ctx.stroke();}
  ctx.restore();
}
// ----- per-rule chart image bank (see docs/IBCS-Rule-Image-Mapping.md) -----
// Lazily loads and caches the Do/Don't bitmap for a rule code; returns the image
// only once it has loaded, so callers fall back to the procedural glyph until then.
const _chartImgBank=Object.create(null);
function ruleChartImage(code,side,variant){
  if(!code||!side||typeof Image==='undefined')return null;
  if(!window.IBCS||typeof window.IBCS.imagePath!=='function')return null;
  const path=window.IBCS.imagePath(code,side,variant);
  let rec=_chartImgBank[path];
  if(!rec){
    rec={img:new Image(),ready:false,failed:false};
    rec.img.onload=()=>{rec.ready=rec.img.naturalWidth>0;};
    rec.img.onerror=()=>{rec.failed=true;};
    rec.img.src=path;
    _chartImgBank[path]=rec;
  }
  return rec.ready?rec.img:null;
}
function drawChartImageFit(img,x,y,w,h){
  const iw=img.naturalWidth,ih=img.naturalHeight;
  if(!iw||!ih)return false;
  const s=Math.min(w/iw,h/ih),dw=iw*s,dh=ih*s;
  ctx.imageSmoothingEnabled=true; // chart screenshots are photographic — smooth-scale them
  ctx.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh);
  ctx.imageSmoothingEnabled=false;
  return true;
}
let _glyphRenderer=null;
function drawChartGlyph(kind,x,y,w,h){
  // Delegate to the shared IBCSCharts renderer (ibcs_charts.js) — the single
  // source of truth for every procedural rule icon, so the platformer, swipe and
  // escape room all draw the exact same bold vector glyph set. The local switch
  // below is kept only as a fallback if ibcs_charts.js fails to load.
  if(typeof IBCSCharts==='function'){ if(!_glyphRenderer)_glyphRenderer=IBCSCharts(ctx); _glyphRenderer.glyph(kind,x,y,w,h); return; }
  const cx=x+w/2, cy=y+h/2;
  const vals=[0.5,0.82,0.42,1.0,0.66];
  switch(kind){
    case 'pie':{
      const r=Math.min(w,h)/2;
      pieSlices(cx,cy,r,['#e23b3b','#3b6fe2','#37a76a','#e2a93b','#8e5bd0'],[3,2,2,1.5,1.5]);
      sCir(cx,cy,r,'#ffffff',1);return;
    }
    case 'line':{
      dLine(x,y+h,x+w,y+h,'#9aa3b0',1.2);dLine(x,y,x,y+h,'#9aa3b0',1.2);
      const pts=[[x,y+h*0.7],[x+w*0.25,y+h*0.4],[x+w*0.5,y+h*0.55],[x+w*0.75,y+h*0.18],[x+w,y+h*0.32]];
      ctx.strokeStyle='#2b6fe2';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
      for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.stroke();return;
    }
    case 'bar':{ // horizontal bars
      const hv=[0.9,0.6,0.78,0.45];const bh=(h-2)/hv.length-2;
      for(let i=0;i<hv.length;i++){const by=y+i*(bh+2);fRect(x,by,Math.max(2,w*hv[i]),Math.max(2,bh),'#4a5160');}
      return;
    }
    // ---- IBCS notation columns ----
    case 'barSolid':   // actual values = solid fill
      vBars(x,y,w,h,vals,(bx,by,bw,bh)=>fRect(bx,by,bw,bh,'#4a5160'));return;
    case 'barOutline': // plan values = outlined / hollow
      vBars(x,y,w,h,vals,(bx,by,bw,bh)=>{fRect(bx,by,bw,bh,'#fdfdfd');ctx.strokeStyle='#4a5160';ctx.lineWidth=1.3;ctx.strokeRect(bx,by,bw,bh);});return;
    case 'barHatched': // forecast = hatched
      vBars(x,y,w,h,vals,(bx,by,bw,bh)=>{fRect(bx,by,bw,bh,'#eef1f5');ctx.strokeStyle='#4a5160';ctx.lineWidth=1.1;ctx.strokeRect(bx,by,bw,bh);hatchRect(bx,by,bw,bh,'#4a5160');});return;
    case 'barLight':   // previous year = light grey
      vBars(x,y,w,h,vals,(bx,by,bw,bh)=>fRect(bx,by,bw,bh,'#b8bec8'));return;
    case 'barDark':    // wrong: heavy near-black
      vBars(x,y,w,h,vals,(bx,by,bw,bh)=>fRect(bx,by,bw,bh,'#23272e'));return;
    case 'bigNumber':{ // plain big number (bad)
      dText('1.2M',Math.max(8,Math.min(h*0.9,13)),cx,cy,'#3a3f4a',true,false,true);return;
    }
    case 'deviation':{ // deviation bars around a zero line (good)
      const dv=[0.6,-0.35,0.45,-0.7,0.3];
      dLine(x,cy,x+w,cy,'#9aa3b0',1);
      const bw=(w-2)/dv.length-2;
      for(let i=0;i<dv.length;i++){const bx=x+i*(bw+2),bh=Math.abs(dv[i])*(h/2);
        const by=dv[i]>=0?cy-bh:cy;fRect(bx,by,Math.max(2,bw),Math.max(1,bh),dv[i]>=0?'#37a76a':'#e23b3b');}
      return;
    }
    case 'meceGood':{ // clean non-overlapping stacked column
      const segs=[0.3,0.25,0.25,0.2];const cols=['#4a5160','#6b7280','#868d9b','#a8aeb8'];
      const bwc=w*0.5,bx=cx-bwc/2;let yy=y+h;
      for(let i=0;i<segs.length;i++){const sh=h*segs[i];yy-=sh;fRect(bx,yy,bwc,sh,cols[i]);}
      ctx.strokeStyle='#2b2f38';ctx.lineWidth=1;ctx.strokeRect(bx,y,bwc,h);return;
    }
    case 'meceBad':{ // overlapping segments + a gap (bad)
      const bwc=w*0.5,bx=cx-bwc/2;
      ctx.save();ctx.globalAlpha=0.6;
      fRect(bx,y+h*0.08,bwc,h*0.42,'#e23b3b');
      fRect(bx,y+h*0.34,bwc,h*0.42,'#3b6fe2'); // overlaps the red
      fRect(bx,y+h*0.82,bwc,h*0.22,'#e2a93b'); // gap above
      ctx.restore();return;
    }
    case 'clutter':{ // busy chart: background, gridlines, 3D, rainbow (bad)
      fRect(x,y,w,h,'#e8edf2');
      for(let gy=y;gy<=y+h;gy+=Math.max(3,h/4))dLine(x,gy,x+w,gy,'#c0c8d0',0.5);
      const pal=['#e23b3b','#3b6fe2','#37a76a','#e2a93b','#8e5bd0'];
      const bw=(w-2)/vals.length-2;
      for(let i=0;i<vals.length;i++){const bx=x+i*(bw+2),bh=h*vals[i],by=y+h-bh;
        fRect(bx,by,Math.max(2,bw),bh,pal[i]);
        fPoly([[bx+bw,by],[bx+bw+2,by-2],[bx+bw+2,y+h-2],[bx+bw,y+h]],'rgba(0,0,0,0.22)');}
      ctx.strokeStyle='#9aa3b0';ctx.lineWidth=1;ctx.strokeRect(x,y,w,h);return;
    }
    case 'clean':{ // minimal columns + thin baseline (good)
      dLine(x,y+h,x+w,y+h,'#c0c8d0',1);
      vBars(x,y,w,h,vals,(bx,by,bw,bh)=>fRect(bx,by,bw,bh,'#4a5160'));return;
    }
    case 'axisBreak':{ // bars on a broken/truncated axis (bad)
      const brk=y+h-4;const bw=(w-2)/vals.length-2;
      for(let i=0;i<vals.length;i++){const bh=h*vals[i]*0.7;fRect(x+i*(bw+2),brk-bh,Math.max(2,bw),Math.max(2,bh),'#4a5160');}
      ctx.strokeStyle='#e23b3b';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(x,brk);ctx.lineTo(x+3,brk-2);ctx.lineTo(x+6,brk+2);ctx.lineTo(x+9,brk-2);ctx.lineTo(x+w,brk);ctx.stroke();return;
    }
    case 'axisFull':{ // full axis from zero (good)
      dLine(x,y+h,x+w,y+h,'#9aa3b0',1);dLine(x,y,x,y+h,'#9aa3b0',1);
      vBars(x,y,w,h,vals,(bx,by,bw,bh)=>fRect(bx,by,bw,bh,'#37a76a'));return;
    }
    case 'column':{ // proper bar/column chart on a zero baseline (good)
      dLine(x,y+h,x+w,y+h,'#9aa3b0',1.2);
      vBars(x,y,w,h,vals,(bx,by,bw,bh)=>fRect(bx,by,bw,bh,'#4a5160'));return;
    }
    case 'gauge':{ // speedometer / gauge (bad)
      const r=Math.min(w,h*1.7)/2, gx=cx, gy=y+h*0.92;
      ctx.lineWidth=Math.max(2.5,h*0.2);ctx.lineCap='butt';
      const seg=[['#37a76a',Math.PI,Math.PI*1.34],['#e2a93b',Math.PI*1.34,Math.PI*1.67],['#e23b3b',Math.PI*1.67,Math.PI*2]];
      for(const s of seg){ctx.strokeStyle=s[0];ctx.beginPath();ctx.arc(gx,gy,r,s[1],s[2]);ctx.stroke();}
      const na=Math.PI*1.72;ctx.strokeStyle='#23272e';ctx.lineWidth=Math.max(1.6,h*0.09);ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(gx+Math.cos(na)*r*0.92,gy+Math.sin(na)*r*0.92);ctx.stroke();
      ctx.fillStyle='#23272e';ctx.beginPath();ctx.arc(gx,gy,Math.max(1.6,h*0.09),0,Math.PI*2);ctx.fill();return;
    }
    case 'radar':{ // radar / spider chart (bad)
      const r=Math.min(w,h)/2*0.94, n=5;
      const pt=(rad,k)=>[cx+Math.cos(-Math.PI/2+k*2*Math.PI/n)*rad, cy+Math.sin(-Math.PI/2+k*2*Math.PI/n)*rad];
      ctx.strokeStyle='#c0c8d0';ctx.lineWidth=0.8;
      for(let ring=1;ring<=2;ring++){ctx.beginPath();for(let k=0;k<n;k++){const p=pt(r*ring/2,k);k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);}ctx.closePath();ctx.stroke();}
      for(let k=0;k<n;k++){const p=pt(r,k);dLine(cx,cy,p[0],p[1],'#c0c8d0',0.8);}
      const dv=[0.95,0.5,0.85,0.4,0.7];
      ctx.fillStyle='rgba(59,111,226,0.5)';ctx.strokeStyle='#2b6fe2';ctx.lineWidth=1.5;
      ctx.beginPath();for(let k=0;k<n;k++){const p=pt(r*dv[k],k);k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);}ctx.closePath();ctx.fill();ctx.stroke();return;
    }
    case 'funnel':{ // funnel chart (bad)
      const cols=['#3b6fe2','#37a76a','#e2a93b','#e23b3b'],n=cols.length,gap=1,segH=(h-gap*(n-1))/n;
      for(let i=0;i<n;i++){const wTop=w*(1-i*0.22),wBot=w*(1-(i+1)*0.22),yt=y+i*(segH+gap);
        fPoly([[cx-wTop/2,yt],[cx+wTop/2,yt],[cx+wBot/2,yt+segH],[cx-wBot/2,yt+segH]],cols[i]);}
      return;
    }
    case 'ring':{ // ring / donut chart (bad)
      const r=Math.min(w,h)/2;
      pieSlices(cx,cy,r,['#e23b3b','#3b6fe2','#37a76a','#e2a93b','#8e5bd0'],[3,2,2,1.5,1.5]);
      ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(cx,cy,r*0.5,0,Math.PI*2);ctx.fill();
      sCir(cx,cy,r,'#ffffff',1);return;
    }
    case 'traffic':{ // traffic-light symbols (bad)
      const r=Math.min(w/2,h/6)*0.92;
      fRect(cx-r-2,y,(r+2)*2,h,'#2b2f38');
      const cols=['#e23b3b','#e2a93b','#37a76a'];
      for(let i=0;i<3;i++){const cyl=y+h*(i+0.5)/3;ctx.fillStyle=cols[i];ctx.beginPath();ctx.arc(cx,cyl,r,0,Math.PI*2);ctx.fill();}
      return;
    }
    case 'spaghetti':{ // overplotted "spaghetti" lines (bad)
      dLine(x,y+h,x+w,y+h,'#c0c8d0',1);
      const pal=['#e23b3b','#3b6fe2','#37a76a','#e2a93b','#8e5bd0'];
      for(let s=0;s<pal.length;s++){ctx.strokeStyle=pal[s];ctx.lineWidth=1.4;ctx.beginPath();
        for(let i=0;i<=4;i++){const px=x+w*i/4,py=y+h*(0.2+0.6*Math.abs(Math.sin(i*1.7+s*1.3)));i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.stroke();}
      return;
    }
    case 'smallMultiples':{ // grid of comparable mini-charts (good)
      const gx=2,gy=2,cw=(w-gx)/2,chh=(h-gy)/2;
      const sets=[[0.5,0.8,0.6],[0.7,0.4,0.9],[0.6,0.9,0.5],[0.4,0.7,0.85]];
      for(let q=0;q<4;q++){const ox2=x+(q%2)*(cw+gx),oy2=y+Math.floor(q/2)*(chh+gy);
        dLine(ox2,oy2+chh,ox2+cw,oy2+chh,'#c0c8d0',0.6);
        vBars(ox2,oy2,cw,chh,sets[q],(bx,by,bw,bh)=>fRect(bx,by,bw,bh,'#4a5160'));}
      return;
    }
  }
  // column-based kinds: column / colorful / mono / generic 'chart'
  let palette;
  if(kind==='colorful')   palette=['#e23b3b','#3b6fe2','#37a76a','#e2a93b','#8e5bd0'];
  else if(kind==='mono')  palette=['#2b2f38','#5a6170','#868d9b','#3a3f4a','#6b7280'];
  else                    palette=['#4a5160'];
  vBars(x,y,w,h,vals,(bx,by,bw,bh,i)=>fRect(bx,by,bw,bh,palette[i%palette.length]));
}
// Draws a chart monster (body + glyph + googly eyes + little feet) within (ox,oy,w,h).
// Pie charts get a ROUND body; everything else sits on a square index card.
function drawChartMonster(kind,ox,oy,w,h,frame,f,code,side){
  const fb=Math.abs(Math.sin(frame))*1.5;
  fEll(ox+4,oy+h-4+fb,8,5,'#3a3f4a');fEll(ox+w-12,oy+h-4-fb,8,5,'#3a3f4a');
  const ed=f>=0?1.2:-1.2;
  // Neutral "screen monster": Do and Don't share the EXACT same chrome (frame,
  // eyes, colour) so nothing telegraphs the verdict — no green/red, no check/cross.
  // Only the chart INSIDE differs (clean monochrome vs colourful clutter), so the
  // player has to actually read the chart to tell a good one from a bad one.
  // The chart is always drawn procedurally (bold vector glyph) — at 34px sprite
  // size the photographic PNGs were illegible, so they are not used here.
  if(kind==='pie'){
    const cx=ox+w/2, cy=oy+(h-4)/2, r=Math.min(w-4,h-6)/2;
    pieSlices(cx,cy,r,['#e23b3b','#3b6fe2','#37a76a','#e2a93b','#8e5bd0'],[3,2,2,1.5,1.5]);
    sCir(cx,cy,r,'#5a6678',1.5);
    const ey=cy-r*0.35;
    fCir(cx-6,ey,3.6,'#fff');fCir(cx+6,ey,3.6,'#fff');
    fCir(cx-6+ed,ey,1.7,'#1a1a1a');fCir(cx+6+ed,ey,1.7,'#1a1a1a');
    sCir(cx-6,ey,3.6,'#5a6678',0.8);sCir(cx+6,ey,3.6,'#5a6678',0.8);
    return;
  }
  // soft drop shadow + neutral bezel (identical for both sides)
  fRRect(ox+3,oy+4,w-2,h-4,5,'rgba(0,0,0,0.16)');
  fRRect(ox+1,oy,w-2,h-4,5,'#eef1f5');
  ctx.strokeStyle='#3a4250';ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(ox+1,oy,w-2,h-4,5);ctx.stroke();
  // inner screen — chart fills almost the whole card so it reads clearly
  const sx=ox+3, sy=oy+9, sw=w-6, sh=h-15;
  fRRect(sx,sy,sw,sh,2,'#ffffff');
  ctx.strokeStyle='#cfd5de';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(sx,sy,sw,sh,2);ctx.stroke();
  drawChartGlyph(kind,sx+1,sy+1,sw-2,sh-2);
  // googly eyes on the top bezel (identical for both sides)
  fCir(ox+11,oy+5,3.4,'#fff');fCir(ox+w-11,oy+5,3.4,'#fff');
  fCir(ox+11+ed,oy+5,1.6,'#1a1a1a');fCir(ox+w-11+ed,oy+5,1.6,'#1a1a1a');
  sCir(ox+11,oy+5,3.4,'#5a6678',0.8);sCir(ox+w-11,oy+5,3.4,'#5a6678',0.8);
}

// ----- Cheat codes -----
// 1) Press L then type a level number (e.g. L 1 1 -> level 11) to warp there.
//    Commits on Enter, on the 2nd digit, or after a short pause. Range 1..RULE_COUNT.
// 2) Type "leben" while playing to refill all lost lives.
let cheatLevelMode=false, cheatLevelBuf='', cheatLevelTO=null, cheatWord='';
let cheatMsg='', cheatMsgTimer=0;
function armCheatTimeout(){if(cheatLevelTO)clearTimeout(cheatLevelTO);cheatLevelTO=setTimeout(commitCheatLevel,700);}
function commitCheatLevel(){if(cheatLevelTO){clearTimeout(cheatLevelTO);cheatLevelTO=null;}if(cheatLevelBuf)jumpToLevel(parseInt(cheatLevelBuf,10));cheatLevelMode=false;cheatLevelBuf='';}
function handleCheatKey(e){
  if(state!=='playing'&&state!=='levelcomplete'&&state!=='intro'){cheatLevelMode=false;cheatLevelBuf='';return;}
  const k=e.key;
  if(k==='l'||k==='L'){cheatLevelMode=true;cheatLevelBuf='';armCheatTimeout();}
  else if(cheatLevelMode&&k>='0'&&k<='9'){cheatLevelBuf+=k;armCheatTimeout();if(cheatLevelBuf.length>=2)commitCheatLevel();}
  else if(cheatLevelMode&&k==='Enter'){commitCheatLevel();}
  else if(cheatLevelMode){cheatLevelMode=false;cheatLevelBuf='';}
  if(/^[a-zA-Z]$/.test(k)){
    cheatWord=(cheatWord+k.toLowerCase()).slice(-8);
    if(cheatWord.endsWith('leben')&&player){
      player.lives=player.maxLives;cheatWord='';sfxItem();
      cheatMsg='LEBEN \u2014 lives restored';cheatMsgTimer=120;
    }
  }
}

// ===== HELPERS =====
const {sin,cos,PI,floor,round,abs,max,min,sqrt,random,atan2}=Math;
const TAU=PI*2;
const rnd=(a,b)=>floor(random()*(b-a+1))+a;
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,lo,hi)=>max(lo,min(hi,v));

class Rect {
  constructor(x,y,w,h){this.x=x;this.y=y;this.w=w;this.h=h;}
  get l(){return this.x;} get r(){return this.x+this.w;} get t(){return this.y;} get b(){return this.y+this.h;}
  get cx(){return this.x+this.w/2;} get cy(){return this.y+this.h/2;}
  set l(v){this.x=v;} set r(v){this.x=v-this.w;} set t(v){this.y=v;} set b(v){this.y=v-this.h;}
  hit(o){return this.x<o.x+o.w&&this.x+this.w>o.x&&this.y<o.y+o.h&&this.y+this.h>o.y;}
}

const particles=[];
class Particle {
  constructor(x,y,vx,vy,life,r,col,grav=0,shrink=true){
    this.x=x;this.y=y;this.vx=vx;this.vy=vy;
    this.life=life;this.maxLife=life;this.r=r;this.col=col;
    this.grav=grav;this.shrink=shrink;this.dead=false;
  }
  update(){this.x+=this.vx;this.y+=this.vy;this.vy+=this.grav;this.life--;if(this.life<=0)this.dead=true;}
  draw(cam){
    const a=this.life/this.maxLife,r=this.shrink?this.r*a:this.r;
    ctx.globalAlpha=a*0.8;ctx.fillStyle=this.col;
    ctx.beginPath();ctx.arc(this.x-cam,this.y,max(r,0.5),0,TAU);ctx.fill();ctx.globalAlpha=1;
  }
}
function emit(x,y,count,spread,speed,life,r,col,grav=0){
  for(let i=0;i<count;i++){
    const a=random()*TAU,s=random()*speed;
    particles.push(new Particle(x,y,cos(a)*s*spread,sin(a)*s-random()*speed*0.5,life+rnd(-5,5),r+random()*r*0.5,col,grav));
  }
}

let shakeX=0,shakeY=0,shakeT=0;
function shake(intensity,dur){shakeT=dur;shakeX=intensity;shakeY=intensity;}

// ===== DRAW PRIMITIVES =====
function radGrad(x,y,r1,r2,c1,c2){const g=ctx.createRadialGradient(x,y,r1,x,y,r2);g.addColorStop(0,c1);g.addColorStop(1,c2);return g;}
function linGrad(x1,y1,x2,y2,stops){const g=ctx.createLinearGradient(x1,y1,x2,y2);for(const[s,c]of stops)g.addColorStop(s,c);return g;}
function fRect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}
function fRRect(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
function fEll(x,y,w,h,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x+w/2,y+h/2,max(w/2,0.1),max(h/2,0.1),0,0,TAU);ctx.fill();}
function sEll(x,y,w,h,c,lw=1){ctx.strokeStyle=c;ctx.lineWidth=lw;ctx.beginPath();ctx.ellipse(x+w/2,y+h/2,max(w/2,0.1),max(h/2,0.1),0,0,TAU);ctx.stroke();}
function fCir(px,py,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(px,py,max(r,0.1),0,TAU);ctx.fill();}
function sCir(px,py,r,c,lw=1){ctx.strokeStyle=c;ctx.lineWidth=lw;ctx.beginPath();ctx.arc(px,py,max(r,0.1),0,TAU);ctx.stroke();}
function fPoly(pts,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();ctx.fill();}
function dLine(x1,y1,x2,y2,c,lw=1){ctx.strokeStyle=c;ctx.lineWidth=lw;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function drawShadow(x,y,w,h){ctx.save();ctx.globalAlpha=0.2;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(x+w/2,y+h,w/2+4,6,0,0,TAU);ctx.fill();ctx.restore();}
function dText(text,size,x,y,col,center=false,shadow=false,bold=false){
  ctx.font=(bold?'bold ':'')+size+'px "Segoe UI",system-ui,sans-serif';
  ctx.textAlign=center?'center':'left';ctx.textBaseline=center?'middle':'top';
  if(shadow){ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillText(text,x+2,y+2);}
  ctx.fillStyle=col;ctx.fillText(text,x,y);
}

// ===== PLAYER =====
class Player {
  constructor(x,y){
    this.rect=new Rect(x,y,PW,PH);this.vy=0;this.onGround=false;
    this.lives=3;this.maxLives=3;this.score=0;
    this.facingRight=true;this.form='sparky';
    this.atkTimer=0;this.atkCd=0;this.atkRect=null;
    this.guitarAtkTimer=0;this.guitarAtkCd=0;this.guitarAtkRect=null;
    this.runFrame=0;this.invincible=0;this.dustTimer=0;
    this.flyCharges=0;this.maxFlyCharges=0;
  }
  update(plats){
    let dx=0;
    if(keys.ArrowLeft||keys.KeyA){dx=-PLAYER_SPEED;this.facingRight=false;}
    if(keys.ArrowRight||keys.KeyD){dx=PLAYER_SPEED;this.facingRight=true;}
    if((keys.Space||keys.ArrowUp||keys.KeyW)&&this.onGround){
      this.vy=JUMP_FORCE;this.onGround=false;sfxJump();stats.jumps++;
      emit(this.rect.cx,this.rect.b,5,0.8,2,15,3,'rgba(255,255,255,0.6)',0.05);
    }
    const fd=FORM_DATA[this.form];
    if(keys.KeyX&&fd&&fd.fly>0&&this.flyCharges>0){
      this.vy=JUMP_FORCE*0.7;this.flyCharges--;this.onGround=false;keys.KeyX=false;
      playTone(500+(this.maxFlyCharges-this.flyCharges)*60,0.08,'sine',0.04);
      emit(this.rect.cx,this.rect.b,4,1,1.5,12,2,'rgba(160,100,220,0.6)',0.03);
    }
    if(this.onGround){this.maxFlyCharges=fd?fd.fly:0;this.flyCharges=this.maxFlyCharges;}
    this.vy+=GRAVITY;
    this.rect.x+=dx;this._cx(dx,plats);
    this.rect.y+=floor(this.vy);this._cy(plats);
    if(this.atkCd>0)this.atkCd--;
    if(this.atkTimer>0){this.atkTimer--;
      this.atkRect=this.facingRight?new Rect(this.rect.r,this.rect.cy-ATK_H/2,ATK_W,ATK_H)
        :new Rect(this.rect.l-ATK_W,this.rect.cy-ATK_H/2,ATK_W,ATK_H);
    }else this.atkRect=null;
    if(this.guitarAtkCd>0)this.guitarAtkCd--;
    if(this.guitarAtkTimer>0){this.guitarAtkTimer--;
      const gw=ATK_W*1.5,gh=ATK_H*1.3;
      this.guitarAtkRect=this.facingRight?new Rect(this.rect.r,this.rect.cy-gh/2,gw,gh)
        :new Rect(this.rect.l-gw,this.rect.cy-gh/2,gw,gh);
    }else this.guitarAtkRect=null;
    if(this.invincible>0)this.invincible--;
    if(dx!==0)this.runFrame+=0.25;else this.runFrame=0;
    if(abs(dx)>0&&this.onGround){this.dustTimer++;
      if(this.dustTimer%5===0)emit(this.rect.cx-(this.facingRight?8:-8),this.rect.b-2,1,0.5,1,12,2,'rgba(180,160,120,0.5)',-0.02);
    }else this.dustTimer=0;
  }
  attack(){
    if(this.atkCd>0||this.atkTimer>0)return;
    this.atkTimer=ATK_DUR;this.atkCd=ATK_CD;stats.attacks++;
    const a=(FORM_DATA[this.form]||{}).atk||'wave';
    if(a==='thunder')sfxThunder();else if(a==='fire')sfxFire();else if(a==='water')sfxWater();else sfxWave();
  }
  guitarAttack(){
    if(this.guitarAtkCd>0||this.guitarAtkTimer>0)return;
    this.guitarAtkTimer=28;this.guitarAtkCd=45;stats.attacks++;
    sfxGuitar();
  }
  _cx(dx,ps){for(const p of ps)if(this.rect.hit(p)){if(dx>0)this.rect.r=p.l;else if(dx<0)this.rect.l=p.r;}}
  _cy(ps){this.onGround=false;for(const p of ps)if(this.rect.hit(p)){if(this.vy>0){this.rect.b=p.t;this.vy=0;this.onGround=true;}else if(this.vy<0){this.rect.t=p.b;this.vy=0;}}}

  draw(cam,tick){
    if(this.invincible>0&&floor(this.invincible/3)%2===0)return;
    const x=this.rect.x-cam,y=this.rect.y;
    drawShadow(x,y,PW,PH);
    ctx.save();ctx.translate(x+PW/2,y+PH);ctx.scale(this.facingRight?1:-1,1);ctx.translate(-PW/2,-PH);
    this._dAnalyst(tick);
    ctx.restore();
    if(this.atkTimer>0&&this.atkRect){
      const a=(FORM_DATA[this.form]||{}).atk||'wave';
      if(a==='thunder')this._drawThunder(cam,tick);
      else if(a==='fire')this._drawFire(cam,tick);
      else if(a==='water')this._drawWaterAtk(cam,tick);
      else this._drawWave(cam,tick);
    }
    if(this.guitarAtkTimer>0&&this.guitarAtkRect)this._drawGuitar(cam,tick);
  }

    fCir(15,15+b,1.5,'#1a1a1a');fCir(25,15+b,1.5,'#1a1a1a');
    // mic boom

  }

  // ===== ATTACK: ELECTRIC GUITAR (for bosses) =====
  _drawGuitar(cam,tick){
    const prog=1-this.guitarAtkTimer/28,swing=sin(prog*PI)*30;
    const gx=this.guitarAtkRect.x-cam+(this.facingRight?20:-20),gy=this.guitarAtkRect.cy-20;
    ctx.save();
    ctx.translate(gx,gy);
    ctx.rotate((this.facingRight?1:-1)*(swing*PI/180));
    // Guitar body (V-shape)
    ctx.fillStyle=linGrad(-15,-10,15,10,[[0,'#1a1a2e'],[0.5,'#2a2a3e'],[1,'#1a1a2e']]);
    ctx.beginPath();
    ctx.moveTo(0,-18);ctx.lineTo(-12,0);ctx.lineTo(-10,8);ctx.lineTo(10,8);ctx.lineTo(12,0);ctx.closePath();
    ctx.fill();
    // Pickups
    fRect(-6,-2,3,6,'#c0c0c0');fRect(3,-2,3,6,'#c0c0c0');
    // Strings
    for(let i=0;i<6;i++){const sy=-12+i*4;
      dLine(-10,sy,10,sy,'rgba(200,200,200,0.6)',0.5);}
    // Neck
    fRect(-2,-18,4,10,'#5a4030');
    // Headstock
    fRect(-4,-24,8,6,linGrad(-4,-24,4,-18,[[0,'#3a2820'],[1,'#5a4030']]));
    // Tuning pegs
    for(let i=0;i<3;i++){fCir(-3,-22+i*2,1,'#808080');fCir(3,-22+i*2,1,'#808080');}
    // Lightning/energy effect
    ctx.globalAlpha=0.7*(1-prog);
    for(let i=0;i<8;i++){
      const ex=random()*24-12,ey=random()*16-8;
      fCir(ex,ey,2+random()*3,'#ffff00');
    }
    // Sound waves
    ctx.strokeStyle='rgba(255,200,0,'+((1-prog)*0.5)+')';
    ctx.lineWidth=2;
    for(let r=10;r<40;r+=10){
      ctx.beginPath();ctx.arc(0,0,r+(prog*20),0,PI*2);ctx.stroke();
    }
    ctx.restore();
    if(prog<0.3&&this.guitarAtkTimer%2===0)
      emit(this.guitarAtkRect.cx,this.guitarAtkRect.cy,3,1.5,2,12,3,'#ffff00',0);
  }

  // ===== ATTACK: THUNDER =====
  _drawThunder(cam,tick){
    const ax=this.atkRect.x-cam,ay=this.atkRect.y,prog=1-this.atkTimer/ATK_DUR,f=this.facingRight?1:-1;
    ctx.save();ctx.globalAlpha=0.15*(1-prog);fRect(ax,ay,ATK_W,ATK_H,'#ffff40');ctx.restore();
    for(let i=0;i<6;i++){let bx=ax+i*(ATK_W/6),by=ay+random()*ATK_H;const pts=[[bx,by]];
      for(let j=0;j<4;j++){bx+=(6+random()*14)*f;by+=-10+random()*20;pts.push([bx,by]);}
      ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
      for(let k=1;k<pts.length;k++)ctx.lineTo(pts[k][0],pts[k][1]);ctx.stroke();
      ctx.strokeStyle='#ffff40';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
      for(let k=1;k<pts.length;k++)ctx.lineTo(pts[k][0],pts[k][1]);ctx.stroke();}
    if(this.atkTimer%3===0)emit(this.atkRect.cx,this.atkRect.cy,2,1,3,8,2,'#ffff80',0);
  }

  // ===== ATTACK: WAVE (sonic rings) =====
  _drawWave(cam,tick){
    const f=this.facingRight?1:-1,prog=1-this.atkTimer/ATK_DUR;
    const ox=this.rect.cx-cam+f*10,oy=this.rect.cy;
    const fd=FORM_DATA[this.form]||{};
    const hue=fd.color||'#a080d0';
    for(let i=0;i<5;i++){const r=18+prog*90+i*20;const a=max(0,(200-i*35-prog*100)/255);
      if(a>0){ctx.strokeStyle=hue;ctx.globalAlpha=a;ctx.lineWidth=3;ctx.beginPath();ctx.arc(ox,oy,r,0,TAU);ctx.stroke();ctx.globalAlpha=1;}}
    ctx.save();ctx.globalAlpha=0.5*(1-prog);fCir(ox,oy,6+prog*14,hue);ctx.restore();
    if(this.atkTimer%4===0)emit(ox+this.rect.cx-this.rect.cx+cam*0,oy,2,2,2,10,2,hue,0);
  }

  // ===== ATTACK: FIRE (burst) =====
  _drawFire(cam,tick){
    const f=this.facingRight?1:-1,prog=1-this.atkTimer/ATK_DUR;
    const ox=this.rect.cx-cam+f*30,oy=this.rect.cy;
    ctx.save();ctx.globalAlpha=0.2*(1-prog);fCir(ox+f*prog*60,oy,20+prog*30,'#ff4010');ctx.restore();
    for(let i=0;i<8;i++){
      const fx=ox+f*(prog*80+i*10)+sin(tick*0.3+i)*4;
      const fy=oy+sin(tick*0.4+i*0.8)*(4+i*2);
      const fr=6-i*0.5;ctx.globalAlpha=max(0,0.7-prog-i*0.08);
      fCir(fx,fy,fr,i<3?'#ffd040':(i<6?'#ff6020':'#ff3010'));
    }
    ctx.globalAlpha=1;
    if(this.atkTimer%3===0)emit(ox+cam,oy,3,1.5,3,12,3,'#ff8040',0.03);
  }

  // ===== ATTACK: WATER (stream) =====
  _drawWaterAtk(cam,tick){
    const f=this.facingRight?1:-1,prog=1-this.atkTimer/ATK_DUR;
    const ox=this.rect.cx-cam+f*20,oy=this.rect.cy;
    for(let i=0;i<6;i++){
      const wx=ox+f*(prog*70+i*12)+sin(tick*0.3+i)*3;
      const wy=oy+sin(tick*0.5+i*1.2)*5;
      const wr=5-i*0.4;ctx.globalAlpha=max(0,0.6-prog*0.3-i*0.06);
      fCir(wx,wy,wr,i<2?'#a0e0ff':(i<4?'#50b0e0':'#2080c0'));
    }
    ctx.globalAlpha=1;ctx.save();ctx.globalAlpha=0.15*(1-prog);fCir(ox+f*prog*40,oy,15,'#60c0ff');ctx.restore();
    if(this.atkTimer%3===0)emit(ox+cam,oy,2,1,3,10,2,'#80d0ff',0.02);
  }
}

  }
}

// ===== LEVEL GENERATOR =====
let currentLevel=1, boss=null, lavaZones=[];

function generateLevel(lvlIdx){
  const cfg=LEVELS[lvlIdx];
  const lvl=lvlIdx+1;const rule=ibcsRule(lvl);
  const plats=[],enemies=[],coins=[],waterZones=[],chartItems=[];
  const sw=max(200,STEP_W-(lvlIdx>8?lvlIdx*3:0));
  const eSpd=cfg.eSpd*ENEMY_SPEED;

  // Start flat
  const startW=max(300,500-lvlIdx*10);
  plats.push(new Rect(0,GROUND,startW,50));
  let x=startW;const lavaArr=[];
  const G=GROUND, nSteps=cfg.steps, dragonSpd=1.5+lvlIdx*0.05;
  const pitAt=(px,gw)=>{ if(cfg.hasLava)lavaArr.push(new Lava(px,gw,G)); else if(cfg.hasWater)waterZones.push(new Water(px,gw,G)); };
  // Pick one of four layout archetypes (cycling per level) so consecutive
  // levels feel structurally different, not just rescaled copies of one template.
  const arch=lvlIdx%4;
  let dragon;

  if(arch===0){
    // A) Classic mountain: hazard, ascend, summit + dragon gap, descend, hazard.
    if(cfg.hasWater&&!cfg.hasLava){const gw=100+lvlIdx*8;waterZones.push(new Water(x,gw,G));plats.push(new Rect(x+gw/2-40,G-60,80,15));x+=gw;}
    else if(cfg.hasLava){const gw=100+lvlIdx*10;lavaArr.push(new Lava(x,gw,G));plats.push(new Rect(x+gw/3-30,G-70,65,15));plats.push(new Rect(x+gw*2/3-30,G-50,65,15));x+=gw;}
    const midW=max(200,300-lvlIdx*5);plats.push(new Rect(x,G,midW,50));x+=midW;
    for(let i=0;i<nSteps;i++)plats.push(new Rect(x+i*sw,G-(i+1)*STEP_H,sw,(i+1)*STEP_H+50));
    const sY=G-(nSteps+1)*STEP_H,sLX=x+nSteps*sw,sH=(nSteps+1)*STEP_H+50,sGW=350+lvlIdx*15;
    plats.push(new Rect(sLX,sY,250,sH));const sRX=sLX+250+sGW;plats.push(new Rect(sRX,sY,250,sH));
    dragon=new Dragon(sLX+250+50,sY+22,sLX+250,sRX,dragonSpd);
    const dSX=sRX+250;for(let i=0;i<nSteps;i++)plats.push(new Rect(dSX+i*sw,G-(nSteps-i)*STEP_H,sw,(nSteps-i)*STEP_H+50));
    x=dSX+nSteps*sw;
    if(cfg.hasLava&&lvlIdx>6){const gw=100+lvlIdx*8;lavaArr.push(new Lava(x,gw,G));plats.push(new Rect(x+gw/3,G-60,60,15));plats.push(new Rect(x+gw*2/3,G-90,60,15));x+=gw;}
    else if(cfg.hasWater&&lvlIdx>3){const gw=80+lvlIdx*6;waterZones.push(new Water(x,gw,G));plats.push(new Rect(x+gw/2-30,G-50,60,15));x+=gw;}
  }
  else if(arch===1){
    // B) Floating islands: hop a chain of ledges at varying heights over one big pit.
    const midW=max(180,260-lvlIdx*4);plats.push(new Rect(x,G,midW,50));x+=midW;
    const islN=4+(lvlIdx%3),iw=120,gap=72+min(lvlIdx*2,30),pitStart=x,hVar=[70,120,90,140,100];
    for(let i=0;i<islN;i++){plats.push(new Rect(x,G-hVar[i%hVar.length],iw,15));x+=iw+gap;}
    const pitW=x-pitStart-gap;pitAt(pitStart,pitW);
    dragon=new Dragon(pitStart+pitW*0.3,G-115,pitStart,pitStart+pitW,dragonSpd);
    x=pitStart+pitW;const landW=max(220,320-lvlIdx*4);plats.push(new Rect(x,G,landW,50));x+=landW;
  }
  else if(arch===2){
    // C) Twin towers: climb peak 1, ride the dragon across a hazard valley, descend peak 2.
    const n1=max(2,nSteps-1);
    for(let i=0;i<n1;i++)plats.push(new Rect(x+i*sw,G-(i+1)*STEP_H,sw,(i+1)*STEP_H+50));
    const tY=G-(n1+1)*STEP_H,t1X=x+n1*sw,tH=(n1+1)*STEP_H+50;
    plats.push(new Rect(t1X,tY,220,tH));
    const gap=300+lvlIdx*10,t2X=t1X+220+gap;
    pitAt(t1X+220,gap);
    dragon=new Dragon(t1X+220+30,tY+24,t1X+220,t2X,dragonSpd);
    plats.push(new Rect(t2X,tY,220,tH));
    const dSX=t2X+220;for(let i=0;i<n1;i++)plats.push(new Rect(dSX+i*sw,G-(n1-i)*STEP_H,sw,(n1-i)*STEP_H+50));
    x=dSX+n1*sw;
  }
  else{
    // D) Gauntlet flats: long fast ground, two hazard pits, raised platforms, a high-flying dragon.
    plats.push(new Rect(x,G,360,50));x+=360;
    const gw1=90+lvlIdx*5;pitAt(x,gw1);plats.push(new Rect(x+gw1/2-32,G-70,64,15));x+=gw1;
    plats.push(new Rect(x,G,520,50));
    plats.push(new Rect(x+130,G-95,120,15));plats.push(new Rect(x+320,G-150,120,15));
    dragon=new Dragon(x+200,G-150,x+120,x+460,dragonSpd);
    x+=520;
    const gw2=100+lvlIdx*5;pitAt(x,gw2);plats.push(new Rect(x+gw2/2-32,G-60,64,15));x+=gw2;
    plats.push(new Rect(x,G,260,50));x+=260;
  }

  // Boss arena
  const bossW=700+lvlIdx*20;plats.push(new Rect(x,GROUND,bossW,50));

  // Boss (only on the last rule-level of a stage)
  if(cfg.boss){
    const bx=x+bossW-300;
    boss=new Boss(bx,GROUND-60,bx-100,bx+180,cfg.boss);
    boss.hp=cfg.bossHp;boss.maxHp=cfg.bossHp;boss.speed=1.2+lvlIdx*0.05;
  }else{boss=null;}

  // Flag
  const flag=new Flag(x+bossW-100,GROUND);

  // Distribute enemies (avoid gaps)
  const totalW=x+bossW;const eCount=cfg.enemies;
  const eZone=totalW-200;
  // Collect all gap zones to avoid
  const gapZones=[];
  for(const w of waterZones)gapZones.push({l:w.rect.x,r:w.rect.x+w.rect.w});
  for(const lv of lavaArr)gapZones.push({l:lv.rect.x,r:lv.rect.x+lv.rect.w});
  gapZones.push({l:dragon.lb,r:dragon.rb});
  for(let i=0;i<eCount;i++){
    const ex=150+floor(i*eZone/eCount);
    // Skip if enemy would be in a gap
    let inGap=false;for(const g of gapZones)if(ex>=g.l&&ex<=g.r){inGap=true;break;}
    if(inGap)continue;
    const ey=GROUND-34;
    const lb=max(0,ex-100),rb=min(totalW,ex+150);
    let onPlat=false;
    for(const p of plats){if(ex>=p.x&&ex<=p.x+p.w&&p.t<=GROUND){
      enemies.push(new Enemy(ex,p.t-34,max(p.x,ex-80),min(p.x+p.w,ex+80),eSpd,rule.enemyKind,rule.code));onPlat=true;break;}}
    if(!onPlat)enemies.push(new Enemy(ex,ey,lb,rb,eSpd,rule.enemyKind,rule.code));
  }

  // Distribute coins on platforms
  for(const p of plats){
    if(p.w<100||p.t>GROUND)continue;
    const nc=max(1,floor(p.w/120));
    for(let i=0;i<nc;i++){const cx=p.x+40+i*(p.w-80)/max(1,nc-1);coins.push(new Coin(cx,p.t-30));}
  }

  // Distribute "good" IBCS charts \u2014 they WALK like enemies and look the same; touch to collect a bonus.
  if(rule.good){
    for(const p of plats){
      if(p.w<150||p.t>GROUND)continue;
      const gx=p.cx-17;
      chartItems.push(new ChartItem(gx,p.t-34,max(p.x,gx-70),min(p.x+p.w,gx+70),-eSpd,rule.good,rule.code));
    }
  }

  // Dummy items (forms assigned by level config)
  const foxI=new CollectItem(-100,-100,'',0,'');foxI.collected=true;
  const eggI=new CollectItem(-100,-100,'',0,'');eggI.collected=true;
  const batI=new CollectItem(-100,-100,'',0,'');batI.collected=true;

  // Clouds
  const clouds=[];for(let i=0;i<15;i++)clouds.push(new Cloud(rnd(0,totalW),rnd(30,150),rnd(50,120)));

  lavaZones=lavaArr;
  return{plats,enemies,coins,flag,clouds,water:waterZones,dragon,foxI,eggI,batI,chartItems,slogan:rule.slogan};
}

// ===== SLOGAN BANNER =====
function drawSlogan(){
  if(sloganTimer<=0||!levelSlogan)return;
  const r=ibcsRule(currentLevel);const st=STAGES[r.stageIdx];
  let alpha=1;if(sloganTimer<40)alpha=sloganTimer/40;else if(sloganTimer>360)alpha=(390-sloganTimer)/30;
  ctx.save();ctx.globalAlpha=max(0,alpha);
  const bw=Math.min(W-40,Math.max(420,levelSlogan.length*9+80));
  fRRect(W/2-bw/2,52,bw,72,12,'rgba(8,16,32,0.92)');
  ctx.strokeStyle=st.color;ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(W/2-bw/2,52,bw,72,12);ctx.stroke();
  dText('Stage '+(r.stageIdx+1)+' · '+r.pillar+' · '+r.sub+' '+r.subTitle,10,W/2,66,st.color,true,false,true);
  dText(r.code+'  '+r.title,15,W/2,87,'#fff',true,true,true);
  dText('DO: '+r.do,11,W/2,104,'#37d67a',true,false,true);
  dText("DON'T: "+r.dont,11,W/2,117,'#e2706a',true,false,true);
  ctx.restore();
}

  // Approval button (pulsing glow)
  const b=INTRO_BTN,gt=Date.now()*0.006;

}

  // Fly charges
  if(fd.fly>0){for(let i=0;i<player.maxFlyCharges;i++){const fx=W-70-i*16,fy=30;

  // Cheat code feedback
  if(cheatLevelMode){dText('LEVEL? '+cheatLevelBuf,13,W/2,58,'#ffd700',true,true,true);}
  if(cheatMsgTimer>0){cheatMsgTimer--;

// ===== GAME STATE =====
let state='title',won=false,tick=0;
let player,plats,enemies,coins,flag,clouds,waterZones,dragon,foxI,eggI,batI,chartItems=[];
let levelSlogan=null,sloganTimer=0;
let camX=0,targetCamX=0,titleAnim=0;
let completeTimer=0,evolutionFrom=null,evolutionTo=null;
// How long the post-level learning summary stays up before auto-advancing
// (60 ticks ≈ 1s); pressing any key after the first ~0.5s skips ahead.
const LEVEL_SUMMARY_AUTO_ADVANCE_TICKS=600;

function startGame(){ startAtLevel(1); }
// Begin a run at an arbitrary (unlocked) rule-level — used by the level-select.
function startAtLevel(n){
  initAudio();currentLevel=clampLvl(n);stats.reset();stats.levelReached=currentLevel;
  unlockedForms=['sparky','bigrest'];
  player=new Player(50,H-130);
  player.form=LEVELS[currentLevel-1].form;
  if(!unlockedForms.includes(player.form))unlockedForms.push(player.form);
  loadLevel();
}
function loadLevel(){
  initBgElements();

  plats=lv.plats;enemies=lv.enemies;coins=lv.coins;flag=lv.flag;clouds=lv.clouds;
  waterZones=lv.water;dragon=lv.dragon;foxI=lv.foxI;eggI=lv.eggI;batI=lv.batI;
  chartItems=lv.chartItems;levelSlogan=lv.slogan;sloganTimer=lv.slogan?390:0;
  // Open every rule-level on the paused intro card; gameplay begins on approval.
  tick=0;won=false;state=lv.slogan?'intro':'playing';atkQueued=false;guitarAtkQueued=false;camX=0;particles.length=0;
  player.rect.x=50;player.rect.y=H-130;player.vy=0;
  const fd=FORM_DATA[player.form]||{};
  player.maxFlyCharges=fd.fly||0;player.flyCharges=player.maxFlyCharges;

function completeLevel(){
  const cfg=LEVELS[currentLevel-1];
  if(!unlockedForms.includes(cfg.form))unlockedForms.push(cfg.form);
  if(!stats.formsCollected.includes(cfg.form))stats.formsCollected.push(cfg.form);
  evolutionFrom=null;evolutionTo=null;
  // Checkpoint: clearing a substage's last rule-level unlocks the next substage.
  if(isSubEnd(currentLevel)){
    unlockSub(subGlobalOf(currentLevel)+1);
    // Persist the substage just completed to the player's profile (host DB).
    emitStageComplete(subGlobalOf(currentLevel), currentLevel);
  }
  // A whole pillar cleared bumps pillarsCompleted (0..7).
  if(isStageEnd(currentLevel)){ stats.pillarsCompleted=Math.max(stats.pillarsCompleted,stageOf(currentLevel)+1); }
  emitLevelSummary(currentLevel);
  state='levelcomplete';completeTimer=0;sfxLevelUp();
}
function advanceLevel(){
  if(currentLevel>=RULE_COUNT){ // IBCS 3.0 finale cleared -> win + certified
    state='gameover';won=true;stats.ibcsCertified=true;stats.finalize(player,true);stats.publish();sfxWin();return;
  }
  currentLevel++;stats.levelReached=Math.max(stats.levelReached,currentLevel);
  const nextCfg=LEVELS[currentLevel-1];
  player.form=nextCfg.form;
  if(!unlockedForms.includes(player.form))unlockedForms.push(player.form);
  const savedScore=player.score,savedLives=player.lives;
  loadLevel();player.score=savedScore;player.lives=savedLives;
}
function jumpToLevel(n){ // cheat: warp to any level, keeping score & lives
  if(state!=='playing'&&state!=='levelcomplete'&&state!=='intro')return;
  n=clampLvl(n);
  currentLevel=n;stats.levelReached=max(stats.levelReached||1,n);
  const cfg=LEVELS[currentLevel-1];
  player.form=cfg.form;
  if(!unlockedForms.includes(player.form))unlockedForms.push(player.form);
  const savedScore=player.score,savedLives=player.lives;
  loadLevel();player.score=savedScore;player.lives=savedLives;

}
function switchForm(){
  if(unlockedForms.length<=1)return;
  const idx=unlockedForms.indexOf(player.form);
  const next=(idx+1)%unlockedForms.length;
  player.form=unlockedForms[next];
  const fd=FORM_DATA[player.form]||{};
  player.maxFlyCharges=fd.fly||0;player.flyCharges=player.maxFlyCharges;

function respawn(){player.rect.x=50;player.rect.y=H-130;player.vy=0;player.invincible=90;}

// ===== ISO 24896 MEMORY ROOM =====
// A side-quest vault reached from the CHECK floor of the IBCS Tower once the three
// Notation stages are cleared. The player sees "ISO 24896" once, walks on, then
// must set 5 jump-blocks to the digits 2-4-8-9-6 to unlock the vault door. Solving
// it returns to the tower (it is no longer the game's finale).
const ISO_CODE=[2,4,8,9,6];
let isoBlocks=[],isoDoor=null,isoPlats=[],isoReveal=0,isoSolved=false,isoWinTimer=0,isoDigits=[0,0,0,0,0];
function enterIsoRoom(){
  initAudio();
  state='isoroom';tick=0;camX=0;particles.length=0;isoSolved=false;isoWinTimer=0;isoReveal=210;
  const roomLen=2000;
  isoPlats=[new Rect(0,GROUND,roomLen,50)];
  // 5 digit blocks, spaced across the corridor, jump-height above the ground
  isoBlocks=[];isoDigits=[0,0,0,0,0];
  for(let i=0;i<5;i++){
    isoBlocks.push({i,digit:0,rect:new Rect(520+i*230,GROUND-150,52,46),cd:0,bump:0});
  }
  isoDoor=new Rect(roomLen-160,GROUND-220,40,220);
  player.rect.x=40;player.rect.y=GROUND-PH;player.vy=0;player.invincible=30;
  sfxItem();
}
function updateIsoRoom(){
  tick++;if(isoReveal>0)isoReveal--;
  const preVy=player.vy;
  const phys=isoSolved?isoPlats:isoPlats.concat([isoDoor.rect]);
  player.update(phys);
  // Bump blocks from below to cycle their digit
  if(!isoSolved){
    for(const b of isoBlocks){
      if(b.cd>0)b.cd--;if(b.bump>0)b.bump--;
      const pr=player.rect;
      const overlapX=pr.r>b.rect.l+4&&pr.l<b.rect.r-4;
      const fromBelow=pr.cy>b.rect.cy&&pr.t<=b.rect.b+8&&pr.t>=b.rect.b-14;
      if(b.cd===0&&overlapX&&fromBelow&&preVy<0){
        b.digit=(b.digit+1)%10;isoDigits[b.i]=b.digit;b.cd=16;b.bump=8;
        playTone(440+b.digit*40,0.07,'square',0.05);
        emit(b.rect.cx,b.rect.t,6,0.8,2,14,2,'#ffd700',0.05);
      }
    }
    // Solved?
    if(isoDigits.every((d,i)=>d===ISO_CODE[i])){
      isoSolved=true;stats.isoMemorized=true;saveIsoMemorized();sfxWin();shake(4,12);
      emit(isoDoor.x+isoDoor.w/2,isoDoor.y+40,30,1.5,3,30,4,'#37d67a',0.02);
    }
  }
  // Fall safety
  if(player.rect.t>H+100){player.rect.x=40;player.rect.y=GROUND-PH;player.vy=0;}
  // Walk through the open door -> standard memorized, return to the IBCS Tower
  if(isoSolved){isoWinTimer++;
    if(player.rect.l>isoDoor.x+isoDoor.w&&isoWinTimer>20){
      stats.isoMemorized=true;saveIsoMemorized();sfxWin();openLevelSelect();cheatMsg='ISO 24896 memorized!';cheatMsgTimer=150;return;
    }
  }
  targetCamX=player.rect.cx-W/3;targetCamX=max(0,targetCamX);camX=lerp(camX,targetCamX,CAM_LERP);
  for(let i=particles.length-1;i>=0;i--){particles[i].update();if(particles[i].dead)particles.splice(i,1);}
  if(shakeT>0)shakeT--;else{shakeX=0;shakeY=0;}
}
function drawIsoRoom(){
  ctx.save();if(shakeT>0)ctx.translate((random()-0.5)*shakeX*2,(random()-0.5)*shakeY*2);
  // Vault background
  fRect(0,0,W,H,linGrad(0,0,0,H,[[0,'#11131c'],[1,'#05060a']]));
  for(let i=0;i<30;i++){const sx=((i*123)-camX*0.3)%W,sy=(i*53)%(H*0.5);ctx.save();ctx.globalAlpha=0.12;fCir((sx+W)%W,sy,1.4,'#aab4ff');ctx.restore();}
  // Floor

  // Digit blocks
  for(const b of isoBlocks){
    const bx=b.rect.x-camX, by=b.rect.y-(b.bump>0?b.bump:0);
    fRRect(bx,by,b.rect.w,b.rect.h,6,b.cd>0?'#caa63a':'#c79a2e');
    fRRect(bx+3,by+3,b.rect.w-6,b.rect.h-6,4,'#f1d97a');

  }
  // Vault door
  const dx=isoDoor.x-camX;
  if(isoSolved){
    fRRect(dx,isoDoor.y,isoDoor.w,isoDoor.h,4,'rgba(55,214,122,0.25)');
    ctx.strokeStyle='#37d67a';ctx.lineWidth=3;ctx.strokeRect(dx,isoDoor.y,isoDoor.w,isoDoor.h);
    dText('OPEN',12,dx+isoDoor.w/2,isoDoor.y-12,'#37d67a',true,false,true);
  }else{
    fRRect(dx,isoDoor.y,isoDoor.w,isoDoor.h,4,'#6a2230');
    ctx.strokeStyle='#e2706a';ctx.lineWidth=3;ctx.strokeRect(dx,isoDoor.y,isoDoor.w,isoDoor.h);
    fCir(dx+isoDoor.w/2,isoDoor.y+isoDoor.h/2,10,'#e2706a');dText('LOCK',11,dx+isoDoor.w/2,isoDoor.y-12,'#e2706a',true,false,true);
  }
  // Combination display above the door
  const cdx=isoDoor.x-camX+isoDoor.w/2;
  fRRect(cdx-95,isoDoor.y-70,190,34,6,'rgba(0,0,0,0.6)');
  for(let i=0;i<5;i++){const ok=isoSolved||isoDigits[i]===ISO_CODE[i];
    dText(String(isoDigits[i]),20,cdx-72+i*36,isoDoor.y-53,ok?'#37d67a':'#fff',true,false,true);}
  player.draw(camX,tick);
  for(const p of particles)p.draw(camX);
  ctx.restore();
  // Overlay UI
  dText('THE STANDARDS VAULT',16,W/2,30,'#aab4ff',true,true,true);
  if(isoReveal>0){
    const a=isoReveal>180?(210-isoReveal)/30:Math.min(1,isoReveal/40);
    ctx.save();ctx.globalAlpha=max(0,Math.min(1,a));
    fRRect(W/2-180,H/2-70,360,140,16,'rgba(8,16,32,0.92)');
    ctx.strokeStyle='#aab4ff';ctx.lineWidth=2;ctx.strokeRect(W/2-180,H/2-70,360,140);
    dText('MEMORIZE THE STANDARD',14,W/2,H/2-34,'#aab4ff',true,false,true);
    dText('ISO 24896',46,W/2,H/2+8,'#fff',true,true,true);
    dText('it fades — then unlock the vault',12,W/2,H/2+48,'rgba(255,255,255,0.6)',true,false,true);
    ctx.restore();
  }else if(!isoSolved){
    dText('Jump under the blocks to set the 5-digit code that unlocks the door',13,W/2,H-40,'rgba(255,255,255,0.65)',true,false,true);
  }else{
    dText('★ ISO 24896 — correct! Walk through the open vault door ★',15,W/2,H-40,'#37d67a',true,true,true);
  }
}

// ===== LEVEL SELECT — "IBCS TOWER" BUSINESS BUILDING MAP =====
// A vertical cross-section of an office tower. Each of the 7 IBCS 2.0 stages is a
// floor (14 rooms = 14 rule-levels) + an 8th floor: the IBCS 3.0 bonus stage (5
// rooms). The 3 Notation stages sit on the lowest floors and are bracketed
// "ISO 24896"; the CHECK floor also holds the ISO 24896 memory vault as an extra
// room. The 4 Composition stages rise above them, IBCS 3.0 crowns the top. The
// building's architecture ages upward — medieval ground floor -> hyper-futuristic
// top. Navigation copies the Jump & Run world-map: an overview that eases-zooms
// onto the active floor while a little office avatar walks between rooms.
let menuCd=0;

// ---- Building geometry (tower-space coords; camera maps these onto 900x600) ----
const T_FLOORS=8, T_FLOOR_H=132, T_TOPM=104, T_BASE=120;
const T_BLD_X=132, T_BLD_W=636;                    // building outer box
const T_INT_X=T_BLD_X+22, T_INT_W=T_BLD_W-44;      // interior (rooms live here)
const TOWER_W=900, TOWER_H=T_TOPM+T_FLOORS*T_FLOOR_H+T_BASE; // 104+1056+120=1280
function floorTopY(f){ return T_TOPM+(7-f)*T_FLOOR_H; }   // f0=ground (bottom), f7=top
function floorCenterY(f){ return floorTopY(f)+T_FLOOR_H/2; }
// Floor 7 (top) is the IBCS 3.0 bonus stage (5 rooms). Floor 2 (CHECK — the last
// Notation floor) carries an extra room: the ISO 24896 memory vault (room index 14).
const ISO_FLOOR=2, ISO_ROOM=14;
function isIsoRoom(f,r){ return f===ISO_FLOOR && r===ISO_ROOM; }
function floorRoomCount(f){ return f===7?5:(f===ISO_FLOOR?15:14); }
function floorFirstLevel(f){ return f*14+1; }             // f 0..7 -> 1,15,...,99
function floorArea(f){ return f===7?'Bonus':(f<3?'Notation':'Composition'); }
function roomRect(f,r){
  const pad=12,gap=6,n=floorRoomCount(f),usable=T_INT_W-pad*2;
  const rw=(usable-gap*(n-1))/n;
  return {x:T_INT_X+pad+r*(rw+gap), y:floorTopY(f)+46, w:rw, h:58};
}

// ---- Era palettes: ground floor (0) medieval -> top floor (7) hyper-future ----
const T_ERAS=[
  {name:'Middle Ages',  wall:'#6f6253', wall2:'#574b3d', frame:'#3d342a', glass:'#241c12', lit:'#f0b94a', dim:'#5a4a30'},
  {name:'Renaissance',  wall:'#b29a72', wall2:'#9b8460', frame:'#73593c', glass:'#352a1c', lit:'#f3d27e', dim:'#7a6038'},
  {name:'Industrial',   wall:'#86503f', wall2:'#6c3f31', frame:'#3a2620', glass:'#22150f', lit:'#f0904a', dim:'#7a4226'},
  {name:'Electric Era', wall:'#5d6f7c', wall2:'#495866', frame:'#2d3a44', glass:'#18222c', lit:'#ffe79c', dim:'#46586a'},
  {name:'Mid-Century',  wall:'#3f807c', wall2:'#316a66', frame:'#214340', glass:'#142c2a', lit:'#9ff0e0', dim:'#2e6a64'},
  {name:'Corporate',    wall:'#3970a0', wall2:'#2c597f', frame:'#1d3a54', glass:'#12273a', lit:'#a6d8ff', dim:'#2c6092'},
  {name:'Smart Office', wall:'#2f936d', wall2:'#247a58', frame:'#194c38', glass:'#103224', lit:'#9fffce', dim:'#258a62'},
  {name:'Hyper-Future', wall:'#2a2050', wall2:'#1a1438', frame:'#46398a', glass:'#0d0a22', lit:'#5cf6ff', dim:'#7a4ad8'},
];
const T_AREA_COL={Notation:'#7fb2ff', Composition:'#5be08c', Bonus:'#ffd24a'};

// ---- Cursor + camera + avatar state ----
let selFloor=0, selRoom=0;
let avX=0, avY=0, avLeg=0;
let towerMode='intro', towerTimer=0, towerAnim=0;
let tcamX=TOWER_W/2, tcamY=TOWER_H/2, tscale=0.45, ttgtX=0, ttgtY=0, ttgtS=0;
const T_FOCUS_S=1.12, T_INTRO_HOLD=46;
const T_OVERVIEW={x:TOWER_W/2, y:TOWER_H/2, s:Math.min((W-26)/TOWER_W,(H-22)/TOWER_H)};
function clampTCamY(y,s){ const half=H/(2*s); if(2*half>=TOWER_H)return TOWER_H/2; return clamp(y,half,TOWER_H-half); }
function clampTCamX(x,s){ const half=W/(2*s); if(2*half>=TOWER_W)return TOWER_W/2; return clamp(x,half,TOWER_W-half); }
function applyTowerCam(){ ctx.save(); ctx.translate(W/2,H/2); ctx.scale(tscale,tscale); ctx.translate(-tcamX,-tcamY); }

// Highest level the player has unlocked (last rule of the highest unlocked substage).
function highestUnlockedLevel(){
  let hi=1;
  for(let i=0;i<SUBSTAGES.length;i++) if(isSubUnlocked(i))
    hi=(i+1<SUBSTAGES.length?SUBSTAGES[i+1].firstLvl-1:RULE_COUNT);
  return hi;
}
function roomLevel(f,r){ return floorFirstLevel(f)+r; }       // rule rooms only (not the ISO vault)
function roomUnlocked(f,r){
  // ISO vault unlocks once the 3 Notation stages (levels 1-42) are CLEARED.
  // Use the persisted substage unlocks (highestUnlockedLevel) — NOT the transient
  // stats.levelReached, which resets to 1 on every fresh load.
  if(isIsoRoom(f,r)) return highestUnlockedLevel()>=43;
  return isSubUnlocked(ibcsRule(roomLevel(f,r)).subGlobal);
}
function roomDone(f,r){
  if(isIsoRoom(f,r)) return isoMemorizedSaved || !!stats.isoMemorized;
  return roomLevel(f,r)<=stats.levelReached;
}

function openLevelSelect(){
  buildTowerArt();
  const hi=highestUnlockedLevel();
  selFloor=Math.min(7,Math.floor((hi-1)/14)); selRoom=Math.min((hi-1)%14, floorRoomCount(selFloor)-1);
  const rr=roomRect(selFloor,selRoom); avX=rr.x+rr.w/2; avY=rr.y+rr.h-3;
  towerMode='intro'; towerTimer=0; menuCd=8;
  tcamX=T_OVERVIEW.x; tcamY=T_OVERVIEW.y; tscale=T_OVERVIEW.s;
  ttgtX=tcamX; ttgtY=tcamY; ttgtS=tscale;
  state='levelselect';
}
function towerLock(msg){ cheatMsg=msg; cheatMsgTimer=120; menuCd=10; }
function tryStartRoom(){
  if(isIsoRoom(selFloor,selRoom)){
    if(roomUnlocked(selFloor,selRoom)){ keys.Enter=false;keys.NumpadEnter=false; enterIsoRoom(); }
    else towerLock('Clear the 3 Notation stages to unlock the ISO 24896 vault');
    return;
  }
  const lvl=roomLevel(selFloor,selRoom);
  if(isSubUnlocked(ibcsRule(lvl).subGlobal)){ keys.Enter=false;keys.NumpadEnter=false;keys.Space=false; startAtLevel(lvl); }
  else towerLock('Locked — clear earlier rooms first');
}
function updateLevelSelect(){
  towerAnim++;
  if(menuCd>0)menuCd--;
  if(menuCd<=0 && towerMode!=='intro'){
    if(keys.ArrowUp||keys.KeyW){ if(selFloor<7){selFloor++; selRoom=Math.min(selRoom,floorRoomCount(selFloor)-1);} menuCd=9; towerMode='focus'; }
    else if(keys.ArrowDown||keys.KeyS){ if(selFloor>0){selFloor--; selRoom=Math.min(selRoom,floorRoomCount(selFloor)-1);} menuCd=9; towerMode='focus'; }
    else if(keys.ArrowRight||keys.KeyD){ selRoom=Math.min(floorRoomCount(selFloor)-1,selRoom+1); menuCd=6; if(towerMode==='overview')towerMode='focus'; }
    else if(keys.ArrowLeft||keys.KeyA){ selRoom=Math.max(0,selRoom-1); menuCd=6; if(towerMode==='overview')towerMode='focus'; }
    else if(keys.Space){ keys.Space=false; towerMode=(towerMode==='overview')?'focus':'overview'; menuCd=12; }
    else if(keys.Enter||keys.NumpadEnter){ tryStartRoom(); }
    else if(keys.Escape||keys.KeyQ){ keys.KeyQ=false; state='title'; anyKey=false; return; }
  }
  if(towerMode==='intro' && ++towerTimer>T_INTRO_HOLD) towerMode='focus';
  // Camera targets
  if(towerMode==='overview'||towerMode==='intro'){ ttgtX=T_OVERVIEW.x; ttgtY=T_OVERVIEW.y; ttgtS=T_OVERVIEW.s; }
  else { ttgtS=T_FOCUS_S; ttgtX=clampTCamX(TOWER_W/2,T_FOCUS_S); ttgtY=clampTCamY(floorCenterY(selFloor),T_FOCUS_S); }
  const ce=(towerMode==='intro')?0.06:0.12;
  tscale+=(ttgtS-tscale)*ce; tcamX+=(ttgtX-tcamX)*ce; tcamY+=(ttgtY-tcamY)*ce;
  // Avatar eases toward the selected room (walk bob when moving sideways)
  const tr=roomRect(selFloor,selRoom), tx=tr.x+tr.w/2, ty=tr.y+tr.h-3;
  const dx=tx-avX, dy=ty-avY, d=Math.hypot(dx,dy)||1, spd=Math.min(d,5+d*0.14);
  avX+=dx/d*spd; avY+=dy/d*spd;
  if(Math.abs(dx)>1.2 && Math.abs(dx)>Math.abs(dy)) avLeg+=0.34; else avLeg*=0.6;
  if(cheatMsgTimer>0)cheatMsgTimer--;
}

// Given a rule level number, return its {f,r} floor/room in the tower.
function levelFloorRoom(lvl){ const f=Math.floor((lvl-1)/14); return {f, r:(lvl-1)-f*14}; }

// After a level-complete summary the office avatar strolls, inside the tower,
// from the room just cleared to the next room — then that next level begins.
let walkDwell=0;
function walkToNextRoom(){
  // Final rule cleared -> straight to the win screen (nothing to walk to).
  if(currentLevel>=RULE_COUNT){ advanceLevel(); return; }
  buildTowerArt();
  const cur=levelFloorRoom(currentLevel), nxt=levelFloorRoom(currentLevel+1);
  const fr=roomRect(cur.f,cur.r); avX=fr.x+fr.w/2; avY=fr.y+fr.h-3;
  selFloor=nxt.f; selRoom=nxt.r; towerMode='focus'; menuCd=0; walkDwell=0;
  // Start the camera on the cleared floor; it eases toward the target floor.
  tscale=T_FOCUS_S; tcamX=clampTCamX(TOWER_W/2,T_FOCUS_S); tcamY=clampTCamY(floorCenterY(cur.f),T_FOCUS_S);
  ttgtX=tcamX; ttgtY=tcamY; ttgtS=tscale;
  state='towerwalk';
}
function updateTowerWalk(){
  towerAnim++;
  // Camera eases to keep the target room's floor framed (pans up when crossing floors).
  ttgtS=T_FOCUS_S; ttgtX=clampTCamX(TOWER_W/2,T_FOCUS_S); ttgtY=clampTCamY(floorCenterY(selFloor),T_FOCUS_S);
  tscale+=(ttgtS-tscale)*0.12; tcamX+=(ttgtX-tcamX)*0.12; tcamY+=(ttgtY-tcamY)*0.12;
  // Steady, clearly visible stroll toward the next room.
  const tr=roomRect(selFloor,selRoom), tx=tr.x+tr.w/2, ty=tr.y+tr.h-3;
  const dx=tx-avX, dy=ty-avY, d=Math.hypot(dx,dy)||1, spd=Math.min(d,2.6);
  avX+=dx/d*spd; avY+=dy/d*spd;
  if(Math.abs(dx)>1.2 && Math.abs(dx)>Math.abs(dy)) avLeg+=0.34; else avLeg*=0.6;
  // Let an impatient player skip the stroll.
  if(keys.Enter||keys.NumpadEnter||keys.Space){ keys.Enter=false;keys.NumpadEnter=false;keys.Space=false; advanceLevel(); return; }
  // Arrived at the door -> brief pause, then begin the level.
  if(d<3){ if(++walkDwell>22) advanceLevel(); } else walkDwell=0;
}

// ---- Static building art (rendered once to an offscreen canvas, then blitted) ----
let TOWER_ART=null;
function buildTowerArt(){
  if(TOWER_ART)return;
  const SS=2, cvs=document.createElement('canvas');
  cvs.width=TOWER_W*SS; cvs.height=TOWER_H*SS;
  const g=cvs.getContext('2d'); g.scale(SS,SS);
  g.textBaseline='middle';
  const RR=(x,y,w,h,r)=>{g.beginPath();g.roundRect(x,y,w,h,r);};
  const bldBottom=floorTopY(0)+T_FLOOR_H;

  // --- Street / foundation under the tower ---
  const street=g.createLinearGradient(0,bldBottom,0,TOWER_H);
  street.addColorStop(0,'#2a2c33'); street.addColorStop(1,'#15161b');
  g.fillStyle=street; g.fillRect(0,bldBottom,TOWER_W,TOWER_H-bldBottom);
  g.fillStyle='#3a3d46'; g.fillRect(T_BLD_X-26,bldBottom,T_BLD_W+52,16); // plinth
  g.strokeStyle='rgba(255,255,255,0.06)'; g.lineWidth=1;
  for(let x=20;x<TOWER_W;x+=46){ g.beginPath(); g.moveTo(x,bldBottom+22); g.lineTo(x-10,TOWER_H); g.stroke(); }

  // --- Each floor: era facade + slab + header label + room frames ---
  for(let f=0;f<8;f++){
    const era=T_ERAS[f], ty=floorTopY(f);
    const wg=g.createLinearGradient(0,ty,0,ty+T_FLOOR_H);
    wg.addColorStop(0,era.wall); wg.addColorStop(1,era.wall2);
    g.fillStyle=wg; g.fillRect(T_BLD_X,ty,T_BLD_W,T_FLOOR_H);
    // edge shading for depth
    g.fillStyle='rgba(255,255,255,0.05)'; g.fillRect(T_BLD_X,ty,10,T_FLOOR_H);
    g.fillStyle='rgba(0,0,0,0.18)'; g.fillRect(T_BLD_X+T_BLD_W-12,ty,12,T_FLOOR_H);
    // floor slab divider
    g.fillStyle='rgba(0,0,0,0.34)'; g.fillRect(T_BLD_X,ty,T_BLD_W,5);
    g.fillStyle='rgba(255,255,255,0.10)'; g.fillRect(T_BLD_X,ty+5,T_BLD_W,2);
    eraMotif(g,f,era,ty);
    // header label
    const st=STAGES[f];
    g.textAlign='left';
    g.font='bold 17px "Segoe UI",sans-serif'; g.fillStyle=st.color;
    g.fillText((f+1)+' · '+st.pillar, T_INT_X+12, ty+22);
    g.font='12px "Segoe UI",sans-serif'; g.fillStyle='rgba(255,255,255,0.55)';
    g.fillText(st.world+'   ·   '+era.name, T_INT_X+12, ty+39);
    // room frames (static; glass filled live) — the ISO vault gets a gold frame
    for(let r=0;r<floorRoomCount(f);r++){ const q=roomRect(f,r);
      if(isIsoRoom(f,r)){ g.fillStyle='#5a4a14'; RR(q.x-4,q.y-4,q.w+8,q.h+8,7); g.fill(); }
      else { g.fillStyle=era.frame; RR(q.x-2,q.y-2,q.w+4,q.h+4,3); g.fill(); }
    }
  }

  // --- Building outline + corner pilasters ---
  g.strokeStyle='rgba(0,0,0,0.5)'; g.lineWidth=4;
  g.strokeRect(T_BLD_X,floorTopY(7),T_BLD_W,8*T_FLOOR_H);
  g.fillStyle='rgba(0,0,0,0.22)'; g.fillRect(T_BLD_X-6,floorTopY(7),6,8*T_FLOOR_H);
  g.fillStyle='rgba(255,255,255,0.10)'; g.fillRect(T_BLD_X+T_BLD_W,floorTopY(7),6,8*T_FLOOR_H);

  // --- Roof / antenna / building sign (top margin) ---
  const roofY=floorTopY(7);
  g.fillStyle='#16122e'; g.fillRect(T_BLD_X-10,roofY-26,T_BLD_W+20,26);
  g.strokeStyle='#5cf6ff'; g.lineWidth=2; g.beginPath(); g.moveTo(TOWER_W/2,roofY-26); g.lineTo(TOWER_W/2,roofY-72); g.stroke();
  g.fillStyle='#ff5cf0'; g.beginPath(); g.arc(TOWER_W/2,roofY-74,5,0,Math.PI*2); g.fill();
  g.save(); g.shadowColor='#5cf6ff'; g.shadowBlur=14;
  g.font='bold 30px "Segoe UI",sans-serif'; g.textAlign='center'; g.fillStyle='#eaf6ff';
  g.fillText('IBCS  TOWER', TOWER_W/2, roofY-44); g.restore();

  // --- Left brackets: NOTATION (ISO 24896) + COMPOSITION ---
  const bx=T_BLD_X-34;
  function bracket(fa,fb,col,label,sub){
    const yTop=floorTopY(fb)+6, yBot=floorTopY(fa)+T_FLOOR_H-6;
    g.strokeStyle=col; g.lineWidth=3; g.beginPath();
    g.moveTo(bx+14,yTop); g.lineTo(bx,yTop); g.lineTo(bx,yBot); g.lineTo(bx+14,yBot); g.stroke();
    g.save(); g.translate(bx-16,(yTop+yBot)/2); g.rotate(-Math.PI/2); g.textAlign='center';
    g.font='bold 19px "Segoe UI",sans-serif'; g.fillStyle=col; g.fillText(label,0,-10);
    if(sub){ g.font='bold 13px "Segoe UI",sans-serif'; g.fillStyle='#ffd24a'; g.fillText(sub,0,12); }
    g.restore();
  }
  bracket(0,2,T_AREA_COL.Notation,'NOTATION','ISO 24896');
  bracket(3,6,T_AREA_COL.Composition,'COMPOSITION',null);

  // --- "take it to the next level" elevator between Notation & Composition ---
  const divY=floorTopY(3)+T_FLOOR_H; // boundary line (top of CHECK / base of CONDENSE)
  g.save();
  g.strokeStyle='rgba(91,224,140,0.9)'; g.lineWidth=2.5; g.setLineDash([7,5]);
  g.beginPath(); g.moveTo(T_BLD_X+T_BLD_W+18,divY); g.lineTo(T_BLD_X+T_BLD_W+18,floorTopY(6)); g.stroke();
  g.setLineDash([]);
  const ax=T_BLD_X+T_BLD_W+18, ayT=floorTopY(6)+2;
  g.fillStyle='#5be08c'; g.beginPath(); g.moveTo(ax,ayT-12); g.lineTo(ax-7,ayT); g.lineTo(ax+7,ayT); g.closePath(); g.fill();
  g.translate(T_BLD_X+T_BLD_W+34,(divY+floorTopY(6))/2); g.rotate(Math.PI/2); g.textAlign='center';
  g.font='bold 12px "Segoe UI",sans-serif'; g.fillStyle='#9fffc6';
  g.fillText('take it to the next level',0,0);
  g.restore();

  TOWER_ART=cvs;
}

// Compact era-specific decoration drawn onto the floor facade (g = offscreen ctx).
function eraMotif(g,f,era,ty){
  const cy=ty+T_FLOOR_H*0.62, lx=T_BLD_X+18, rx=T_BLD_X+T_BLD_W-18;
  g.save();
  if(f===0){ // medieval — torches + crenellations
    g.fillStyle='rgba(0,0,0,0.25)';
    for(let x=T_BLD_X+6;x<T_BLD_X+T_BLD_W-6;x+=26){ g.fillRect(x,ty+6,12,8); }
    [lx,rx].forEach(x=>{ g.strokeStyle='#3a2a18'; g.lineWidth=3; g.beginPath(); g.moveTo(x,cy+18); g.lineTo(x,cy-10); g.stroke();
      g.fillStyle='#ffb347'; g.beginPath(); g.ellipse(x,cy-16,5,9,0,0,Math.PI*2); g.fill();
      g.fillStyle='#ffe08a'; g.beginPath(); g.ellipse(x,cy-16,2.5,5,0,0,Math.PI*2); g.fill(); });
  } else if(f===1){ // renaissance — arches
    g.strokeStyle='rgba(255,255,255,0.18)'; g.lineWidth=2;
    for(let x=T_BLD_X+30;x<T_BLD_X+T_BLD_W-20;x+=70){ g.beginPath(); g.arc(x,ty+T_FLOOR_H-8,18,Math.PI,0); g.stroke(); }
  } else if(f===2){ // industrial — gear + smokestack
    g.strokeStyle='rgba(255,255,255,0.16)'; g.lineWidth=6;
    g.beginPath(); g.arc(rx-6,cy,12,0,Math.PI*2); g.stroke();
    g.fillStyle='rgba(40,28,22,0.8)'; g.fillRect(lx-2,ty+8,12,T_FLOOR_H*0.4);
    g.fillStyle='rgba(200,200,200,0.12)'; g.beginPath(); g.arc(lx+4,ty+6,9,0,Math.PI*2); g.fill();
  } else if(f===3){ // electric — bulb string
    g.strokeStyle='rgba(255,231,156,0.5)'; g.lineWidth=1.5; g.beginPath();
    for(let x=T_BLD_X+20;x<T_BLD_X+T_BLD_W-10;x+=8){ g.lineTo(x,ty+12+Math.sin(x*0.2)*3); } g.stroke();
    g.fillStyle='#ffe79c'; for(let x=T_BLD_X+24;x<T_BLD_X+T_BLD_W-10;x+=40){ g.beginPath(); g.arc(x,ty+15,3,0,Math.PI*2); g.fill(); }
  } else if(f===4){ // mid-century — starburst
    g.strokeStyle='rgba(159,240,224,0.5)'; g.lineWidth=1.5;
    for(let a=0;a<Math.PI*2;a+=Math.PI/6){ g.beginPath(); g.moveTo(rx-6,cy); g.lineTo(rx-6+Math.cos(a)*12,cy+Math.sin(a)*12); g.stroke(); }
  } else if(f===5){ // corporate — glass curtain grid
    g.strokeStyle='rgba(166,216,255,0.16)'; g.lineWidth=1;
    for(let y=ty+12;y<ty+T_FLOOR_H-6;y+=18){ g.beginPath(); g.moveTo(T_BLD_X+8,y); g.lineTo(T_BLD_X+T_BLD_W-8,y); g.stroke(); }
  } else if(f===6){ // smart office — LED strip + leaf
    g.fillStyle='rgba(159,255,206,0.5)'; g.fillRect(T_BLD_X+8,ty+8,T_BLD_W-16,3);
    g.fillStyle='#5be08c'; g.beginPath(); g.ellipse(rx-4,cy,6,11,0.5,0,Math.PI*2); g.fill();
  } else { // futuristic — neon frame + drone
    g.strokeStyle='rgba(92,246,255,0.6)'; g.lineWidth=2; g.strokeRect(T_BLD_X+8,ty+10,T_BLD_W-16,T_FLOOR_H-20);
    g.fillStyle='#ff5cf0'; g.beginPath(); g.arc(rx-10,ty+22,4,0,Math.PI*2); g.fill();
    g.strokeStyle='#5cf6ff'; g.lineWidth=1.5; g.beginPath(); g.moveTo(rx-20,ty+22); g.lineTo(rx,ty+22); g.stroke();
  }
  g.restore();
}

// Live overlay (room glass + lock/done state + selection + avatar) under the camera.
function drawTowerDynamic(){
  const pulse=0.5+0.5*sin(towerAnim*0.12);
  for(let f=0;f<8;f++){
    const era=T_ERAS[f], n=floorRoomCount(f);
    for(let r=0;r<n;r++){
      const q=roomRect(f,r), unlocked=roomUnlocked(f,r), done=roomDone(f,r), sel=(f===selFloor&&r===selRoom);
      let fill=era.glass;
      if(done) fill=era.lit; else if(unlocked) fill=era.dim;
      if(isIsoRoom(f,r)) fill=done?'#ffd24a':(unlocked?'#8a6f1e':'#3a3015');
      ctx.fillStyle=fill; ctx.beginPath(); ctx.roundRect(q.x,q.y,q.w,q.h,3); ctx.fill();
      if(done){ ctx.save(); ctx.globalAlpha=0.85; ctx.strokeStyle='rgba(255,255,255,0.55)'; ctx.lineWidth=1.4;
        ctx.beginPath(); ctx.moveTo(q.x+q.w*0.28,q.y+q.h*0.55); ctx.lineTo(q.x+q.w*0.45,q.y+q.h*0.72); ctx.lineTo(q.x+q.w*0.74,q.y+q.h*0.34); ctx.stroke(); ctx.restore(); }
      else if(!unlocked){ ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.beginPath(); ctx.roundRect(q.x,q.y,q.w,q.h,3); ctx.fill();
        ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.fillRect(q.x+q.w/2-4,q.y+q.h/2-1,8,7);
        ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=1.4; ctx.beginPath(); ctx.arc(q.x+q.w/2,q.y+q.h/2-1,3,Math.PI,0); ctx.stroke(); }
      if(!isIsoRoom(f,r) && tscale>0.85){ ctx.fillStyle=done?'rgba(20,20,20,0.8)':(unlocked?'rgba(255,255,255,0.85)':'rgba(255,255,255,0.35)');
        ctx.font='bold 11px "Segoe UI",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(roomLevel(f,r), q.x+q.w/2, q.y+12); }
      if(isIsoRoom(f,r) && tscale>0.7){ ctx.fillStyle=unlocked?'#fff3c8':'rgba(255,255,255,0.4)';
        ctx.font='bold 18px "Segoe UI",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('\u2605', q.x+q.w/2, q.y+q.h/2-4);
        ctx.font='bold 9px "Segoe UI",sans-serif'; ctx.fillStyle=unlocked?'rgba(60,40,0,0.9)':'rgba(255,255,255,0.35)';
        ctx.fillText('24896', q.x+q.w/2, q.y+q.h-9); }
      if(sel){ ctx.save(); ctx.strokeStyle='#ffffff'; ctx.lineWidth=2.5; ctx.globalAlpha=0.6+0.4*pulse;
        ctx.beginPath(); ctx.roundRect(q.x-3,q.y-3,q.w+6,q.h+6,5); ctx.stroke(); ctx.restore(); }
    }
  }
  // Avatar (a little office worker) at the cursor room
  drawTowerAvatar(avX,avY);
}
function drawTowerAvatar(x,y){
  const bob=Math.abs(sin(avLeg))*3;
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(x,y+2,8,3,0,0,Math.PI*2); ctx.fill();
  // legs
  ctx.strokeStyle='#22303a'; ctx.lineWidth=3; ctx.lineCap='round';
  const sw=sin(avLeg)*3;
  ctx.beginPath(); ctx.moveTo(x,y-12-bob); ctx.lineTo(x-3+sw,y-bob); ctx.moveTo(x,y-12-bob); ctx.lineTo(x+3-sw,y-bob); ctx.stroke();
  // body (suit)
  ctx.fillStyle='#2e6db4'; ctx.beginPath(); ctx.roundRect(x-6,y-30-bob,12,20,4); ctx.fill();
  ctx.fillStyle='#eaf2ff'; ctx.fillRect(x-2,y-30-bob,4,12); // shirt
  // head
  ctx.fillStyle='#f2c79a'; ctx.beginPath(); ctx.arc(x,y-36-bob,6,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#3a2a1a'; ctx.beginPath(); ctx.arc(x,y-39-bob,6,Math.PI,0); ctx.fill();
  ctx.restore();
}
