server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Ohne diese Zeile antwortet nginx auf .u16, .u8, .u8z und .bin mit text/plain, und der
    # Browser laedt sie trotzdem korrekt als ArrayBuffer - es faellt also nicht auf, bis jemand
    # den Netzwerkmitschnitt liest oder ein Zwischenspeicher die Datei fuer Text haelt.
    types {
        application/json                      json;
        image/jpeg                            jpg jpeg;
        image/webp                            webp;
        image/png                             png;
        application/octet-stream              bin u16 u8 u8z;
    }
    default_type application/octet-stream;

    # ⚠ CORS IST DER GANZE GRUND, WARUM DIESER HOST EIGENE KOPFZEILEN BRAUCHT. Die Anwendung läuft
    # auf dem Fabric-App-Host und holt die Kacheln von hier, das ist also grundsätzlich eine fremde
    # Herkunft. `*` und nicht eine Liste erlaubter Herkünfte, weil jener Hostname plattformvergeben
    # ist und sich bei einer Neubereitstellung ändert — eine gepflegte Liste wäre genau die Art
    # Konfiguration, die still veraltet und dann als Ladefehler im Zwilling auftaucht. Die Dateien
    # sind ohnehin ohne Anmeldung abrufbar, eine Herkunftsbeschränkung würde also nichts schützen,
    # das nicht schon offen liegt.
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, If-None-Match, If-Modified-Since" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag" always;
    add_header Timing-Allow-Origin "*" always;

    # ⚠ KEIN `immutable`, UND DAS IST ABSICHT. Die Dateinamen tragen KEINEN Inhaltshash:
    # drape.jpg heisst nach jedem Neubau wieder drape.jpg. `immutable` hiesse, dass ein Browser
    # eine neu gebaute Kachel bis zum Ablauf nicht wieder abholt - ein neu gerechneter Standort
    # waere dann bei genau den Leuten unsichtbar, die ihn schon einmal gesehen haben, und niemand
    # kaeme auf die Idee, den Zwischenspeicher zu verdaechtigen. Stattdessen ein Tag Frist plus
    # ETag: der Normalfall ist ein 304 mit ein paar hundert Byte, ein Neubau schlaegt trotzdem
    # innerhalb eines Tages durch.
    location /terrain/ {
        # ⚠ DIE CORS-ZEILEN STEHEN HIER NOCH EINMAL, UND DAS IST KEIN VERSEHEN. `add_header` wird
        # in nginx NICHT vererbt, sobald der innere Block eigene `add_header` hat - er ersetzt die
        # aeusseren, statt sie zu ergaenzen. Beim ersten Anlauf standen die CORS-Zeilen nur auf
        # Server-Ebene, und `Cache-Control` hier drin hat sie stillschweigend geloescht: die
        # Dateien kamen mit HTTP 200 und ohne Access-Control-Allow-Origin, also htte der Browser
        # jede einzelne Kachel verworfen. Am Server sah alles richtig aus. Gefunden wurde es nur,
        # weil die Pruefung die Kopfzeilen mitgelesen hat und nicht nur den Statuscode.
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, If-None-Match, If-Modified-Since" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag" always;
        add_header Timing-Allow-Origin "*" always;

        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        etag on;

        # Der Fabric-Host beantwortet Range-Anfragen NICHT (gemessen: 200 mit der ganzen Datei
        # statt 206). Hier gehen sie, was grossen Kacheln beim erneuten Anlauf nach einem
        # Verbindungsabbruch hilft.
        add_header Accept-Ranges bytes always;

        # Nur Text komprimieren. Die schweren Dateien - drape.jpg, heightmap.u16, die
        # LoD2-Netze - sind bereits komprimiert oder dichte Binaerdaten; sie noch einmal durch
        # gzip zu schicken kostet CPU und spart nichts.
        gzip on;
        gzip_types application/json;
        gzip_min_length 1024;

        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ⚠ KEIN SPA-FALLBACK. Der Fabric-Host liefert fuer unbekannte Pfade seine index.html mit
    # HTTP 200 aus, und genau das hat hier einmal einen falschen Befund erzeugt: eine Datei, die
    # es nicht gab, sah aus wie eine, die oeffentlich abrufbar ist. Ein fehlender Pfad muss 404
    # sagen, sonst kann man mit diesem Host nichts mehr nachweisen.
    location / {
        return 404;
    }
}
